<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>索瑪方塊・自由拼</title>
<style>
:root{
  --bg0:#E9EEF4;--bg1:#F7F9FC;--ink:#1B2430;--mute:#5d6b7c;--accent:#1F3A5F;--onaccent:#F4F6F9;
  --glass:rgba(255,255,255,.62);--glassb:rgba(255,255,255,.72);--glassSolid:#fff;--shadow:rgba(20,40,70,.16);--hair:rgba(31,58,95,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg0:#0E131B;--bg1:#1A2431;--ink:#E8EEF6;--mute:#93a3b6;--accent:#9CC0EE;--onaccent:#0E131B;
  --glass:rgba(28,39,54,.58);--glassb:rgba(255,255,255,.10);--glassSolid:#1c2736;--shadow:rgba(0,0,0,.45);--hair:rgba(255,255,255,.10);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 90% at 50% 40%,var(--bg1) 0%,var(--bg0) 72%)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--glassb);box-shadow:0 6px 24px var(--shadow)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glassSolid)}}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button,a{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
#top{position:fixed;z-index:10;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px 0 13px;border-radius:22px;text-decoration:none;font-size:14.5px;font-weight:600;letter-spacing:.04em;color:var(--ink)}
.grp{display:flex;gap:8px}
.fab{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;color:var(--ink);padding:0;transition:transform .15s}
.fab:active,.pill:active{transform:scale(.94)}
.fab.on{color:var(--onaccent);background:var(--accent);border-color:transparent}
.fab[hidden]{display:none}
.fab.ask{width:auto;padding:0 14px;border-radius:22px;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
#sndOff,#sndOn{display:none}
#snd[data-s="1"] #sndOn,#snd[data-s="0"] #sndOff{display:block}
#dock{position:fixed;z-index:10;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translate(-50%,150%);opacity:0;display:flex;gap:2px;padding:6px;border-radius:24px;transition:transform .45s cubic-bezier(.2,.9,.25,1.05),opacity .25s;pointer-events:none}
#dock.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#dock button{width:52px;height:54px;border:0;background:transparent;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--ink);font-size:10.5px;letter-spacing:.03em;transition:transform .12s,background .2s}
#dock button:active{transform:scale(.92);background:var(--hair)}
#dock .sp{width:1px;margin:10px 3px;background:var(--hair)}
@media (min-width:760px) and (min-aspect-ratio:5/4){
  #dock{left:auto;right:max(16px,env(safe-area-inset-right));top:50%;bottom:auto;flex-direction:column;transform:translate(150%,-50%)}
  #dock.on{transform:translate(0,-50%)}
  #dock .sp{width:auto;height:1px;margin:3px 10px}
}
#tip{position:fixed;z-index:9;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 16px;border-radius:20px;font-size:13px;color:var(--mute);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .4s}
#toast{position:fixed;z-index:11;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 54px);transform:translate(-50%,-6px);padding:7px 14px;border-radius:16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#win{position:fixed;z-index:11;left:50%;top:21%;transform:translate(-50%,8px) scale(.82);display:flex;align-items:center;gap:9px;padding:11px 22px;border-radius:28px;font-size:22px;font-weight:700;letter-spacing:.14em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s,transform .55s cubic-bezier(.2,1.3,.3,1)}
#win.on{opacity:1;transform:translate(-50%,0) scale(1)}
#win svg.i{width:22px;height:22px;stroke:var(--accent)}
#cen{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 86px);z-index:12;display:flex;align-items:flex-end;gap:4px;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s}
#cen.on{opacity:1;transform:none}
#cen img{height:78px;width:auto;display:block;filter:drop-shadow(0 2px 3px var(--shadow))}
#cen div{border-radius:16px 16px 16px 5px;padding:8px 12px;font-size:13px;line-height:1.5;margin-bottom:12px;max-width:min(62vw,260px)}
#cen small{display:block;color:var(--mute);font-size:11px}
@media (prefers-reduced-motion:reduce){#dock,#win,#toast,#cen{transition:none}}
@media (max-width:380px){#dock button{width:46px}.pill{padding:0 13px 0 11px}}
</style>

<canvas id="fw" aria-hidden="true"></canvas>
<div id="top">
  <a class="pill glass" id="hubBtn" href="./index.html" aria-label="回錨界入口"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v16" /> <path d="m19 13 2-1a9 9 0 0 1-18 0l2 1" /> <path d="M9 11h6" /> <circle cx="12" cy="4" r="2" /></svg>入口</a>

    <button class="fab glass on" id="bGrav" aria-pressed="true" aria-label="重力" title="重力"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 15 4 4" /> <path d="M2.352 10.648a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l6.029-6.029a1 1 0 1 1 3 3l-6.029 6.029a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l6.365-6.367A1 1 0 0 0 8.716 4.282z" /> <path d="m5 8 4 4" /></svg></button>
    <button class="fab glass" id="snd" data-s="0" aria-label="音效" title="音效"><span id="sndOn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /> <path d="M16 9a5 5 0 0 1 0 6" /> <path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></svg></span><span id="sndOff"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.7.7 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.7.7 0 0 0 11 19.298z" /> <path d="m16.5 14.5 5-5" /> <path d="m16.5 9.5 5 5" /></svg></span></button>
    <button class="fab glass" id="bReset" aria-label="重新擺放" title="重新擺放"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /> <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" /> <path d="M16 16h5v5" /></svg><span id="rsT" hidden>再按一次</span></button>
  </div>
</div>
<div id="toast" class="glass" role="status" aria-live="polite"></div>
<div id="win" class="glass" role="status" aria-live="polite"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" /> <path d="M20 2v4" /> <path d="M22 4h-4" /> <circle cx="4" cy="20" r="2" /></svg><span id="winT"></span></div>
<div id="tip" class="glass">點一塊方塊開始　拖曳空白處轉視角</div>
<div id="dock" class="glass" role="toolbar" aria-label="方塊操作">
  <button id="bY" aria-label="水平旋轉"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /></svg>水平轉</button>
  <button id="bX" aria-label="前後翻轉"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15.194 13.707 3.814 1.86-1.86 3.814" /> <path d="M16.47214 7.52786 A 5 10 0 1 0 13 21.79796" /> <path d="M21.79796 11 A 10 5 0 1 0 19 15.57071" /></svg>前翻</button>
  <button id="bZ" aria-label="側向翻轉"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5H6a2 2 0 0 0-2 2v3" /> <path d="m9 8 3-3-3-3" /> <path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" /></svg>側翻</button>
  <span class="sp"></span>
  <button id="bUp" aria-label="升高"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7" /> <path d="M12 19V5" /></svg>升</button>
  <button id="bDn" aria-label="降低"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14" /> <path d="m19 12-7 7-7-7" /></svg>降</button>
  <button id="bDrop" aria-label="落下"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17V3" /> <path d="m6 11 6 6 6-6" /> <path d="M19 21H5" /></svg>落下</button>
</div>
