<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>錨界入口</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* 佈局概念：上方岑禾的今日一句，下方三張領域卡（海、天、地），最後是本週三燈紀錄。 */
:root{
  --font-display:"Noto Serif TC","Songti TC",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --bg:#e9ecf0; --surface:#f7f6f2; --ink:#1b2433; --muted:#5d6878; --line:#cdd3dc;
  --accent:#2c4a7c; --accent-soft:#dbe4f3; --reward:#b9871f; --reward-soft:#f3e3b5;
  --sea:#1d6a86; --sky:#5559c2; --land:#8f6f22; --bad:#b0382f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141d; --surface:#192031; --ink:#e5e9f1; --muted:#97a2b5; --line:#2c364b;
  --accent:#8fb0e8; --accent-soft:#25324d; --reward:#e3b647; --reward-soft:#4b3d16;
  --sea:#6ec3e0; --sky:#a3a6f5; --land:#e0b95a; --bad:#ec7b70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141d; --surface:#192031; --ink:#e5e9f1; --muted:#97a2b5; --line:#2c364b;
  --accent:#8fb0e8; --accent-soft:#25324d; --reward:#e3b647; --reward-soft:#4b3d16;
  --sea:#6ec3e0; --sky:#a3a6f5; --land:#e0b95a; --bad:#ec7b70; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.55;
  padding-block:8px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,a{font:inherit}
button{color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(26px,7vw,38px);line-height:1.1;margin:0;letter-spacing:.06em}
.sub{color:var(--muted);font-size:12px;letter-spacing:.1em;margin-top:2px}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;min-height:36px}
.today{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.today .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.today .d{font-size:12px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.today .q{font-family:var(--font-display);font-weight:600;font-size:clamp(17px,4.4vw,22px);line-height:1.45;text-wrap:balance}
.today .who{font-size:12px;color:var(--muted);letter-spacing:.1em;display:flex;align-items:center;justify-content:flex-end;gap:10px;text-align:right}
.today .who .ava{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--line);flex:none}
.today .who .role{display:block;font-size:11px;letter-spacing:.06em;opacity:.85}
.cen summary{cursor:pointer;font-size:12px;color:var(--accent);list-style:none;display:inline-block;border-bottom:1px dotted var(--accent);min-height:24px;line-height:24px}
.cen summary::-webkit-details-marker{display:none}
.cen .full{float:right;margin:6px 0 4px 12px;width:132px;text-align:center}
.cen .full img{width:100%;display:block}
.cen .full figcaption{font-size:11px;color:var(--muted);margin-top:2px}
.cen::after{content:"";display:block;clear:both}
.toast .tav{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:6px}
.cen p{margin:4px 0 0;font-size:13px;line-height:1.6;color:var(--muted)}
.week-chip{font-size:11px;border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:0 9px}
h2{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:0 0 4px;font-weight:700}
.cards{display:flex;flex-direction:column;gap:8px}
.card{--icobg:color-mix(in srgb,var(--c) 15%,var(--surface));background:linear-gradient(180deg,color-mix(in srgb,var(--c) 11%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:8px 12px 8px 10px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;min-width:0}
.card .ico{width:52px;height:52px;color:var(--c);background:var(--icobg);border-radius:12px;padding:5px}
.card .ico svg{width:100%;height:100%;display:block}
.card .dom{font-size:11px;letter-spacing:.14em;color:var(--c);font-weight:700;line-height:1.2}
.card h3{margin:0;font-family:var(--font-display);font-size:19px;font-weight:900;letter-spacing:.04em;line-height:1.25}
.card .info{font-size:12px;color:var(--muted);line-height:1.35}
.card .row{display:flex;flex-direction:column;gap:2px;align-items:stretch}
.go{display:inline-flex;align-items:center;justify-content:center;background:var(--c);color:#fff;border-radius:8px;padding:6px 16px;font-weight:700;text-decoration:none;min-height:36px;border:0}
:root[data-theme="dark"] .go{color:#10141d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go{color:#10141d}}
.go[aria-disabled="true"]{background:var(--line);color:var(--muted);cursor:default;pointer-events:none}
.chk{display:flex;gap:5px;align-items:center;font-size:12px;min-height:28px;cursor:pointer;justify-content:center;color:var(--muted)}
.chk input{width:16px;height:16px;accent-color:var(--c)}
.lamps{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.lamps .sum{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px;font-size:13px}
.lamps .sum b{font-size:18px;font-family:var(--font-display);color:var(--reward)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border:1px solid var(--line);border-radius:8px;padding:3px 2px;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.now{border-color:var(--accent);color:var(--ink)}
.day .dots{display:flex;gap:3px;justify-content:center;margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on.sea{background:var(--sea);border-color:var(--sea)}
.dot.on.sky{background:var(--sky);border-color:var(--sky)}
.dot.on.land{background:var(--land);border-color:var(--land)}
.day.full{background:var(--reward-soft);border-color:var(--reward)}
.toast{background:var(--reward-soft);border:1px solid var(--reward);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.how{margin-top:6px;font-size:12px}
.how summary{cursor:pointer;color:var(--accent)}
.how pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:12px;line-height:1.5;white-space:pre}
.how code{font-size:12px}
.note{font-size:12px;color:var(--muted)}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:min(520px,calc(100vw - 32px));width:100%;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px;font-family:var(--font-display)}
input.url{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label.l{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.err{color:var(--bad);font-size:13px;min-height:1.4em}

/* ===== 開場動畫 ===== */
#intro{position:fixed;inset:0;z-index:999;overflow:hidden;color:var(--ink);font-family:var(--font-body);cursor:pointer}
#intro[hidden]{display:none}
#intro .half{position:absolute;top:0;bottom:0;width:51%;background:var(--bg);transition:transform 1s cubic-bezier(.6,0,.2,1)}
#intro .hl{left:0}
#intro .hr{right:0;transform:scaleX(-1)}
#intro .hr.open{transform:scaleX(-1) translateX(105%)}
#intro .hl.open{transform:translateX(-105%)}
#intro .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s;padding:24px;text-align:center}
#intro.out .stage{opacity:0}
#intro .gridsvg{width:min(54vw,210px);height:auto;overflow:visible}
#intro .gl{stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round;stroke-dasharray:var(--len,220);stroke-dashoffset:var(--len,220);opacity:.8}
#intro.go .gl{animation:idraw .7s ease-out forwards;animation-delay:var(--dl,0s)}
@keyframes idraw{to{stroke-dashoffset:0}}
#intro .cellf{fill:var(--sea);opacity:0}
#intro.go .cellf{animation:icell .5s ease forwards;animation-delay:var(--dl,.7s)}
@keyframes icell{to{opacity:.22}}
#intro .cellm{fill:var(--muted);opacity:0}
#intro.go .cellm{animation:icellm .6s ease forwards;animation-delay:1s}
@keyframes icellm{to{opacity:.4}}
#intro h2{color:var(--ink);font-family:var(--font-display);font-weight:900;font-size:clamp(34px,10vw,52px);letter-spacing:.14em;margin:0;opacity:0;transform:translateY(8px)}
#intro.go h2{animation:iup .7s ease forwards;animation-delay:.6s}
#intro .iday{color:var(--muted);letter-spacing:.2em;font-size:13px;opacity:0}
#intro.go .iday{animation:iup .6s ease forwards;animation-delay:.95s}
#intro .say{display:flex;align-items:center;gap:10px;max-width:320px;text-align:left;font-size:14px;line-height:1.55;opacity:0}
#intro .say img{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);flex:none}
#intro.go .say{animation:iup .6s ease forwards;animation-delay:var(--sd,1.5s)}
@keyframes iup{to{opacity:1;transform:none}}
#intro .skip,#intro .snd{position:absolute;top:max(12px,env(safe-area-inset-top,0px));background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:6px 12px;min-height:32px}
#intro .skip{right:max(12px,env(safe-area-inset-right,0px))}
#intro .snd{left:max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:4px}
#intro .snd svg{width:16px;height:16px}
.bgmbtn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:5px;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:8px 13px;min-height:40px;box-shadow:0 4px 16px rgba(0,0,0,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
.bgmbtn[hidden]{display:none}.bgmbtn svg{width:17px;height:17px}.bgmbtn[aria-pressed="true"]{color:var(--accent,currentColor)}
.bgmbtn[aria-pressed="true"] svg{animation:bgmpulse 2.6s ease-in-out infinite}@keyframes bgmpulse{50%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){.bgmbtn[aria-pressed="true"] svg{animation:none}}

.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:6px;min-height:28px}
.opt button{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:13px}
@media (prefers-reduced-motion:reduce){
  #intro .half{transition:none}
  #intro.go .gl,#intro.go .cellf,#intro.go .cellm{animation-duration:.01s;animation-delay:0s}
  #intro .gl{stroke-dashoffset:0}
  #intro.go h2,#intro.go .iday,#intro.go .say{animation-duration:.4s;animation-delay:0s;transform:none}
}
/* ---- 四季 ---- */
html[data-season=spring]{--sbg:#f6e1e8;--sc:#c4688a}
html[data-season=summer]{--sbg:#cde8f1;--sc:#1d8aa8}
html[data-season=autumn]{--sbg:#f4dcc0;--sc:#c0661f}
html[data-season=winter]{--sbg:#d9e5f4;--sc:#5b7fb5}
@media (prefers-color-scheme:dark){
html:not([data-theme="light"])[data-season=spring]{--sbg:#2b2033;--sc:#e79ab6}
html:not([data-theme="light"])[data-season=summer]{--sbg:#10303a;--sc:#5ec3dc}
html:not([data-theme="light"])[data-season=autumn]{--sbg:#35261a;--sc:#e8944a}
html:not([data-theme="light"])[data-season=winter]{--sbg:#17263d;--sc:#9cc0ee}
}
html[data-theme="dark"][data-season=spring]{--sbg:#2b2033;--sc:#e79ab6}
html[data-theme="dark"][data-season=summer]{--sbg:#10303a;--sc:#5ec3dc}
html[data-theme="dark"][data-season=autumn]{--sbg:#35261a;--sc:#e8944a}
html[data-theme="dark"][data-season=winter]{--sbg:#17263d;--sc:#9cc0ee}
body{background:linear-gradient(180deg,var(--sbg) 0,var(--bg) 360px) no-repeat,var(--bg)}
.wrap{position:relative}
.scene{position:absolute;top:-8px;right:0;width:142px;height:89px;color:var(--sc);opacity:.85;pointer-events:none;z-index:0}
.scene svg{display:none;width:100%;height:100%}
html[data-season=spring] .sc-spring,html[data-season=summer] .sc-summer,html[data-season=autumn] .sc-autumn,html[data-season=winter] .sc-winter{display:block}
.wrap>*{position:relative;z-index:1}
.wrap>.scene{position:absolute;z-index:0}
.season-chip{font-size:11px;border:1px solid var(--sc);color:var(--sc);border-radius:99px;padding:0 9px}
.sline{margin-top:6px;padding-left:9px;border-left:2px solid var(--sc);font-size:12.5px;line-height:1.6;color:var(--muted)}
#fall{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
@media (max-width:380px){.scene{width:130px;height:81px}}
</style>

  <header>
    <div>
      <h1>錨界</h1>
      <div class="sub">每日入口 · 校準員，今天也請到站</div>
    </div>
  </header>

var LINES=[["今天的缺口在這裡。先看邊上的數字。","第一次不用快。第一次只要對。","邊上的數字很安靜，但它們從不重複自己。","看不懂的時候，先看最小的那一格。","從最確定的地方開始。其他的會自己靠過來。","今天的霧不厚，但也不薄。","第一週。你還在，這就夠了。"],["再看一眼。世界不會跑，但記憶會。","回聲不會說謊，只會說得很短。","從邊緣看進去，比走進去看得清楚。","視線被擋住的地方，才是線索。","數字是別人替你量好的。別浪費。","每一條線都在告訴你它看見了什麼。","邊界不是牆。是門縫。"],["……好吧。這盞燈算你欠我的。","我的燈不免費。","第二次，也算你欠我的。","問一次是學，問三次是習慣。","燈借出去，光就少一點。我自己的。","不是不借。是借了，你就不會看了。","這週我記了一本帳。你別問裡面寫什麼。"],["別數日子，只管下一盞。","燈一盞接一盞，才叫脈。","斷了不怪你。怪的是不再點的那個人。","備燈是給累的人，不是給懶的人。","我替你守過一晚。別讓我白守。","城裡第一盞燈，是誰點的？沒有人記得。","一個月之後，你會記得今天嗎？我會。"],["試航？好。記得，走不通的分支，會散。","霧很深的時候，船都靠直覺。","有人比我更擅長試航。我只是不願意承認。","試航不是亂猜。是帶著問題往前走。","回頭的人，不一定是輸了。","那艘補丁船，我見過。很久以前。","深的霧，不代表沒有路。"],["它不是原來那一天，但它是真的。","有一天沒人點燈。就那麼一天。","缺日不是你的錯。是霧的。","過去的日子，補上去就是新的了。","補，總比空著好。","我試過不補。結果更糟。","你補的每一天，都是有人欠著的一天。"],["尺上的刻度不全是我刻的。","公文我先放著。","有人在院裡等我回信。我還沒想好怎麼回。","刻度可以量世界，也可以量人。我不喜歡後一種。","院裡的人說話，總是很準。準到不像話。","我離開那裡，不是因為它錯了。","今天先不談院裡。"],["餘像不會痛。我只是記得它們原本的樣子。","它還在。你看見了嗎？","有些東西，不是散了，只是還沒走。","不要靠太近。……算了，靠近一點也行。","我曾經很擅長讓它們走。","別問我它是誰。我還不知道。","今天的題不難。難的是別的。"],["我也在等一個回聲。","一個人點不亮一座城。","你們班的數字在漲。我看見了。","回聲要有很多人一起，才聽得出方向。","我習慣一個人。但這一週，還行。","全服的光，加起來，比我一個人的亮。","別讓它停在這裡。"],["院裡派人來了。","月曆底下還有一頁。我知道它在哪。","那一頁是乾淨的。太乾淨了。","不是霧。霧不會這麼整齊。","有人把它擦過。","我的筆記本上，也有一格是這樣。","下一季見。……別遲到。"]];

function anchorTone(){ // 錨音：主音 → 上行五度 → 落回主音
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!actx)actx=new AC();
    if(actx.state==="suspended")actx.resume();
    if(actx.state!=="running")return;
    var t=actx.currentTime+.02,seq=[523.25,783.99,523.25],i;
    for(i=0;i<3;i++){
      [[1,1],[2,.25],[2.76,.12]].forEach(function(pt){
        var o=actx.createOscillator(),g=actx.createGain();
        o.type="sine";o.frequency.value=seq[i]*pt[0];
        var s=t+i*.28,e=s+(i===2?1.4:.7);
        g.gain.setValueAtTime(.0001,s);g.gain.linearRampToValueAtTime(.09*pt[1],s+.01);g.gain.exponentialRampToValueAtTime(.0001,e);
        o.connect(g);g.connect(actx.destination);o.start(s);o.stop(e+.05);
      });
    }
  }catch(e){}
}

  function Player(ctx,out,season){

(function(){

  var COL={spring:["#f4b6c6","#f9d0da","#eaa0b5"],autumn:["#d9731f","#c2452d","#e0a526","#a85a1c"]};
  function mk(first){
    var r=Math.random(),s=SEASON,o={x:Math.random()*W,y:first?Math.random()*H:-20,ph:Math.random()*6.28,rot:Math.random()*6.28,vr:(Math.random()-.5)*1.2,sw:.4+Math.random()*.8};

    else if(s==="autumn"){o.r=6+Math.random()*4;o.vy=24+r*28;o.c=COL.autumn[(r*4)|0]}
    else if(s==="winter"){o.r=1.4+Math.random()*2.4;o.vy=14+r*26;o.vr=0;o.sw=.3+Math.random()*.6}
    else{o.r=3+Math.random()*7;o.vy=-(10+r*16);o.y=first?Math.random()*H:H+20;o.vr=0;o.sw=.3+Math.random()*.5}
