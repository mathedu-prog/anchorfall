const FLEET_NAMES = { 5: '航空母艦', 4: '巨艦', 3: '戰艦', 2: '潛艇', 1: '單兵快艇' };

const SOUND_DEFAULT = true;      // 第一次進來是否預設開啟音效（玩家按喇叭可隨時開關，並會記住）
const Snd = {
  ctx: null, on: false, waves: null,
  load() { try { const v = localStorage.getItem('bs_snd'); this.on = v === null ? SOUND_DEFAULT : v === '1'; } catch (e) { this.on = SOUND_DEFAULT; } },
  save() { try { localStorage.setItem('bs_snd', this.on ? '1' : '0'); } catch (e) { /* 無法儲存就算了 */ } },
  ok() {
    if (!this.on) return false;
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  startWaves() {                                   // 海浪聲：濾波過的雜訊，音量與亮度隨浪慢慢起伏
    if (!this.ok() || this.waves) return;
    const c = this.ctx, len = c.sampleRate * 4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    const g = c.createGain(); g.gain.value = 0;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.14;
    const lg = c.createGain(); lg.gain.value = 0.09;
    const lf2 = c.createGain(); lf2.gain.value = 380;
    lfo.connect(lg); lg.connect(g.gain); lfo.connect(lf2); lf2.connect(lp.frequency);
    src.connect(lp); lp.connect(g); g.connect(c.destination);
    g.gain.setTargetAtTime(0.13, c.currentTime, 0.6);
    src.start(); lfo.start();
    this.waves = { src, lfo, g };
  },
  stopWaves() {
    const w = this.waves; if (!w) return; this.waves = null;
    try { w.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.25); setTimeout(() => { try { w.src.stop(); w.lfo.stop(); } catch (e) { /* 已停止 */ } }, 1200); } catch (e) { /* 忽略 */ }
  },
  tone(freq, dur, vol, type, delay) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  ding(freq, delay) { this.tone(freq, 1.0, 0.16, 'sine', delay); this.tone(freq * 2.01, 0.5, 0.05, 'sine', delay); },
  swoosh() {
    if (!this.ok()) return;
    const c = this.ctx, len = c.sampleRate * 1.4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(300, c.currentTime); bp.frequency.exponentialRampToValueAtTime(2600, c.currentTime + 1.2);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, c.currentTime + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 1.4);
    s.connect(bp); bp.connect(g); g.connect(c.destination); s.start();
  },
  fanfare(kind) {
    if (kind === 'ontime') [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { this.tone(f, 0.9, 0.17, 'triangle', i * 0.13); this.tone(f * 2, 0.5, 0.04, 'sine', i * 0.13); });
    else if (kind === 'late') { this.tone(783.99, 0.8, 0.13, 'triangle', 0); this.tone(1046.5, 1.0, 0.13, 'triangle', 0.16); }
    else this.ding(1318.5);
  }
};
Snd.load();
function syncSndUI() {
  const t = Snd.on ? '🔊 音效' : '🔇 音效';
  $('navSnd').textContent = t; $('navSnd').classList.toggle('on', Snd.on);
  $('ceSnd').textContent = Snd.on ? '🔊' : '🔇';
}
function toggleSound() {
  Snd.on = !Snd.on; Snd.save(); syncSndUI();
  if (Snd.on) { Snd.ok(); if (CE.running) Snd.startWaves(); toast('音效已開啟'); }
  else { Snd.stopWaves(); toast('音效已關閉'); }
}

const CE = { running: false, id: 0, timers: [], anims: [], raf: 0, user: false, groups: [], cells: [], rn: [], cn: [], fx: [] };
const ceTilt = 56;

function ceStop() {
  CE.id++; CE.timers.forEach(clearTimeout); CE.timers = [];
  CE.anims.forEach(a => { try { a.cancel(); } catch (e) { /* 已結束 */ } }); CE.anims = [];
  cancelAnimationFrame(CE.raf);
  CE.fx.forEach(e => e.remove()); CE.fx = [];
}
function ceClose() {
  ceStop(); CE.running = false; Snd.stopWaves();
  $('cele').classList.remove('show');
}
function ceTween(from, to, ms, ease, step, done) {
  const id = CE.id, t0 = performance.now();
  const tick = now => {
    if (id !== CE.id) return;
    const p = Math.min(1, (now - t0) / ms), e = ease(p);
    step(from + (to - from) * e);
    if (p < 1) CE.raf = requestAnimationFrame(tick); else if (done) done();
  };
  CE.raf = requestAnimationFrame(tick);
}
const easeIO = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeSoft = p => 0.5 - Math.cos(Math.PI * p) / 2;

function celebrate(o) {
  try { ceRun(o); }
  catch (e) {
    console.error(e); ceClose();
    if (o.fallback) o.fallback();
  }
}

function ceRun(o) {
  ceStop();
  const kind = o.kind, full = kind !== 'prac';
  const root = $('cele');
  root.className = 'show k-' + kind;
  CE.running = true; CE.user = false; CE.spinning = false;
  $('ceCardT').innerHTML = o.title; $('ceCardS').innerHTML = o.sub || '';
  const bt = $('ceBtns'); bt.innerHTML = '';
  o.buttons.forEach(b => {
    const x = document.createElement('button'); x.textContent = b.t; if (b.primary) x.className = 'primary';
    x.addEventListener('click', () => { ceClose(); if (b.fn) b.fn(); });
    bt.appendChild(x);
  });
  $('ceCard').classList.remove('in'); $('ceHint').classList.remove('in');
  $('ceSkip').hidden = false;

  /* ---- 棋盤 ---- */
  const stage = $('ceStage'), b3 = $('ceB3'), n = puzzle.size;
  b3.innerHTML = '';
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const W = Math.max(220, Math.min(sw / 1.45, sh / 0.95, 560)), NUMW = 26, s = (W - NUMW) / n;

      A(g.glow, [{ opacity: 0 }, { opacity: 1, offset: 0.55 }, { opacity: 0.85, offset: 0.85 }, { opacity: 0.5 }], { duration: 1100, easing: 'ease-out' });
      A(g.img, [{ filter: 'none' }, { filter: 'brightness(1.2) saturate(1.1)', offset: 0.6 }, { filter: 'brightness(1.06)' }], { duration: 1100 });

               getValues: () => s.rows.slice(a - 1, a - 1 + c).map(r => r.slice(b - 1, b - 1 + d)), setValue: v => { s.rows[a - 1][b - 1] = v; } };

  const teacherMail = 'teacher@preview.local';

  const SpreadsheetApp = { getActiveSpreadsheet: () => ss };

/* =====================================================================

/* 自動出題：每次最多 3 題，避免超過 Apps Script 單次執行時間 */
function bankGenerate(size, level, count) {
  const u = examNeedTeacher_();
  size = Number(size); count = Math.max(1, Math.min(3, Number(count) || 1));
  if (!FLEETS[size]) throw new Error('不支援這個尺寸');
  if (!LEVELS[level]) throw new Error('不支援這個難度');
  const made = [];
  const lock = LockService.getScriptLock(); lock.waitLock(30000);
  try {
    for (let i = 0; i < count; i++) {
      let out = null;
      for (let k = 0; k < 4 && !out; k++) {
        const o = generate(size, Math.floor(Math.random() * 900000000) + 1000, level, { maxMs: 12000 });
        if (o && o.tier !== 0 || (o && level === 'expert')) out = o;
      }
      if (!out) continue;
      const sol = solutionRows(out.puzzle);
      if (!sol) continue;
      const n = bankAll_().filter(function (r) { return r.size === size; }).length + 1;
      const rec = { id: examId_('Q'), name: size + '×' + size + ' ' + TIER_NAME[out.tier] + ' #' + n, puzzle: out.puzzle, sol: sol, tier: out.tier, source: '自動', by: u.email };
      bankAppend_(rec); made.push(rec.id);
    }
  } finally { lock.releaseLock(); }
  return { made: made.length };
}

/* 老師自訂題：伺服器再驗證一次是否唯一解 */
function bankAddCustom(puzzle, name) {
  const u = examNeedTeacher_();
  const p = examCleanPuzzle_(puzzle);
  const res = solve(p, 2, 3000000);
  if (res.aborted) throw new Error('題目太難，無法在時限內確認答案是否唯一');
  if (res.count === 0) throw new Error('這題沒有解，請檢查行列數字與提示');
  if (res.count > 1) throw new Error('這題有多組解，請多加提示讓答案唯一');
  const rt = rate(p);
  const rec = { id: examId_('Q'), name: String(name || '').slice(0, 40) || ('自訂 ' + p.size + '×' + p.size), puzzle: p,
                sol: res.sols[0].map(function (row) { return row.join(''); }), tier: rt.tier, source: '自訂', by: u.email };
  const lock = LockService.getScriptLock(); lock.waitLock(30000);
  try { bankAppend_(rec); } finally { lock.releaseLock(); }
  return { id: rec.id, tier: rec.tier };
}

function examCleanPuzzle_(q) {
  if (!q) throw new Error('缺少題目資料');
  const n = Number(q.size);
  if (!(n >= 4 && n <= 12)) throw new Error('棋盤大小不正確');
  const okType = { water: 1, ship: 1, single: 1, up: 1, down: 1, left: 1, right: 1, mid: 1 };
  const fleet = {};
  Object.keys(q.fleet || {}).forEach(function (k) { const v = Number(q.fleet[k]); if (v > 0 && Number(k) >= 1 && Number(k) <= 6) fleet[Number(k)] = Math.floor(v); });
  if (!Object.keys(fleet).length) throw new Error('船隊不能是空的');
  const rowCounts = (q.rowCounts || []).map(Number), colCounts = (q.colCounts || []).map(Number);
  if (rowCounts.length !== n || colCounts.length !== n) throw new Error('行列數字數量不正確');
  const seen = {}, givens = [];
  (q.givens || []).forEach(function (g) {
    const r = Number(g.r), c = Number(g.c);
    if (!(r >= 0 && r < n && c >= 0 && c < n) || !okType[g.type] || seen[r * n + c]) throw new Error('提示格資料不正確');
    seen[r * n + c] = true; givens.push({ r: r, c: c, type: g.type });
  });
  return { size: n, rowCounts: rowCounts, colCounts: colCounts, fleet: fleet, givens: givens };
}

function bankDelete(ids) {
  examNeedTeacher_();
  const sh = examSheet_(EXAM_CONFIG.BANK, EXAM_CONFIG.BANK_HEADERS), last = sh.getLastRow();
  if (last < 2) return { deleted: 0 };
  const lock = LockService.getScriptLock(); lock.waitLock(30000);
  let n = 0;
  try {
    const vals = sh.getRange(2, 1, last - 1, 1).getValues();
    for (let i = vals.length - 1; i >= 0; i--) if (ids.indexOf(String(vals[i][0])) >= 0) { sh.deleteRow(i + 2); n++; }
  } finally { lock.releaseLock(); }
  return { deleted: n };
}

/* ---- 考卷 ---- */
function examRecord_(row) {
  return { id: String(row[0]), title: String(row[1]), status: String(row[2]), startAt: Number(row[3]) || 0, endAt: Number(row[4]) || 0,
           limitMin: Number(row[5]) || 0, questions: examJson_(row[6], []), ruleHints: Number(row[7]) === 1, at: Number(row[8]) || 0, upd: Number(row[9]) || 0, hideScore: Number(row[10]) === 1 };
}
function examAll_() { return examRows_(EXAM_CONFIG.EXAMS, EXAM_CONFIG.EXAM_HEADERS).map(examRecord_); }
function examFind_(id) { const a = examAll_(); for (let i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }

function examPoints_(e) { return e.questions.reduce(function (s, q) { return s + (Number(q.points) || 0); }, 0); }

/* 考卷是否正在開放作答（狀態＝open，且在開放時段內） */
function examIsOpen_(e, now) {
  if (e.status !== 'open') return false;
  if (e.startAt && now < e.startAt) return false;
  if (e.endAt && now > e.endAt) return false;
  return true;
}

function examUpsert(exam) {
  examNeedTeacher_();
  const title = String(exam && exam.title || '').trim();
  if (!title) throw new Error('請輸入考卷標題');
  const qs = (exam.questions || []).map(function (q) { return { qid: String(q.qid), points: Math.max(0, Number(q.points) || 0) }; });
  if (!qs.length) throw new Error('考卷至少要有一題');
  const have = bankIds_();
  qs.forEach(function (q) { if (!have[q.qid]) throw new Error('有題目已從題庫刪除，請重新選題'); });
  const status = { draft: 1, open: 1, closed: 1 }[exam.status] ? exam.status : 'draft';
  const lock = LockService.getScriptLock(); lock.waitLock(30000);
  try {
    const sh = examSheet_(EXAM_CONFIG.EXAMS, EXAM_CONFIG.EXAM_HEADERS), now = Date.now();
    const rowvals = function (id, created) {
      return [id, title, status, Number(exam.startAt) || '', Number(exam.endAt) || '', Math.max(0, Math.floor(Number(exam.limitMin) || 0)),
              JSON.stringify(qs), exam.ruleHints ? 1 : 0, created, now, exam.hideScore ? 1 : 0];
    };
    if (exam.id) {
      const vals = examRows_(EXAM_CONFIG.EXAMS, EXAM_CONFIG.EXAM_HEADERS);
      for (let i = 0; i < vals.length; i++) if (String(vals[i][0]) === String(exam.id)) {
        sh.getRange(i + 2, 1, 1, EXAM_CONFIG.EXAM_HEADERS.length).setValues([rowvals(String(exam.id), vals[i][8])]);
        return { id: String(exam.id) };
      }
    }
    const id = examId_('E');
    sh.appendRow(rowvals(id, now));
    return { id: id };
  } finally { lock.releaseLock(); }
}

function examGet(id) {
  examNeedTeacher_();
  const e = examFind_(String(id));
  if (!e) throw new Error('找不到這份考卷');
  return e;
}

function examSetStatus(id, status) {
  examNeedTeacher_();
  if (!{ draft: 1, open: 1, closed: 1 }[status]) throw new Error('狀態不正確');
  const sh = examSheet_(EXAM_CONFIG.EXAMS, EXAM_CONFIG.EXAM_HEADERS), vals = examRows_(EXAM_CONFIG.EXAMS, EXAM_CONFIG.EXAM_HEADERS);
  for (let i = 0; i < vals.length; i++) if (String(vals[i][0]) === id) { sh.getRange(i + 2, 3).setValue(status); return { ok: true }; }
  throw new Error('找不到這份考卷');
}

function examDelete(id) {
  examNeedTeacher_();
  const sh = examSheet_(EXAM_CONFIG.EXAMS, EXAM_CONFIG.EXAM_HEADERS), vals = examRows_(EXAM_CONFIG.EXAMS, EXAM_CONFIG.EXAM_HEADERS);
  for (let i = 0; i < vals.length; i++) if (String(vals[i][0]) === id) { sh.deleteRow(i + 2); return { ok: true }; }
  return { ok: false };
}

/* ---- 作答 ---- */
function attRecord_(row) {
  return { examId: String(row[0]), email: String(row[1]), name: String(row[2]), startedAt: Number(row[3]) || 0, savedAt: Number(row[4]) || 0,
           submittedAt: Number(row[5]) || 0, answers: examJson_(row[6], {}), scores: examJson_(row[7], {}), total: Number(row[8]) || 0, status: String(row[9]) };
}
/* 只讀 A:B 兩欄找出這位學生的那一列，再讀那一列（30 人同時作答時，每次只碰自己的資料） */
function attRows_(email, examId) {
  const sh = examSheet_(EXAM_CONFIG.ATT, EXAM_CONFIG.ATT_HEADERS), last = sh.getLastRow(), out = [];
  if (last < 2) return out;
  const v = sh.getRange(2, 1, last - 1, 2).getValues();
  for (let i = 0; i < v.length; i++)
    if (String(v[i][1]).toLowerCase() === email && (!examId || String(v[i][0]) === examId)) out.push(i + 2);
  return out;
}
function attRead_(row) {
  return attRecord_(examSheet_(EXAM_CONFIG.ATT, EXAM_CONFIG.ATT_HEADERS).getRange(row, 1, 1, EXAM_CONFIG.ATT_HEADERS.length).getValues()[0]);
}
function attFind_(examId, email) {
  const rows = attRows_(email, examId);
  return rows.length ? { row: rows[0], rec: attRead_(rows[0]) } : null;
}
function attWrite_(row, a) {
  examSheet_(EXAM_CONFIG.ATT, EXAM_CONFIG.ATT_HEADERS).getRange(row, 1, 1, EXAM_CONFIG.ATT_HEADERS.length).setValues([[
    a.examId, a.email, a.name, a.startedAt, a.savedAt, a.submittedAt || '', JSON.stringify(a.answers), JSON.stringify(a.scores), a.total, a.status]]);
}

function examDeadline_(e, a) {
  let d = 0;
  if (e.limitMin > 0) d = a.startedAt + e.limitMin * 60000;
  if (e.endAt && (!d || e.endAt < d)) d = e.endAt;
  return d;                      // 0 ＝ 沒有時限
}

/* 存檔時只做簡單檢查（不必讀題庫）；交卷時再依題目大小嚴格檢查 */
function examLooseAnswers_(e, ans) {
  const out = {};
  e.questions.forEach(function (q) {
    const s = ans && typeof ans[q.qid] === 'string' ? ans[q.qid] : '';
    out[q.qid] = /^[012]{0,400}$/.test(s) ? s : '';
  });
  return out;
}
function examCleanAnswers_(e, bank, ans) {
  const out = {};
  e.questions.forEach(function (q) {
    const p = bank[q.qid].puzzle, want = p.size * p.size, s = ans && typeof ans[q.qid] === 'string' ? ans[q.qid] : '';
    out[q.qid] = /^[012]*$/.test(s) && s.length === want ? s : '';
  });
  return out;
}

/* 以目前的答案計分、寫入並標記交卷 */
function examFinalize_(e, bank, a, status) {
  const scores = {}; let total = 0;
  e.questions.forEach(function (q) {
    const b = bank[q.qid];
    const g = gradeBoard(b.puzzle, b.sol, a.answers[q.qid] || '', Number(q.points) || 0);
    scores[q.qid] = { pct: g.pct, pts: g.pts, points: g.points, correct: g.correct, wrong: g.wrong, total: g.total, filled: g.filled };
    total += g.pts;
  });
  a.scores = scores; a.total = Math.round(total * 10) / 10; a.submittedAt = Date.now(); a.status = status;
  return a;
}
function examResult_(e, a) {
  if (e.hideScore) return { hidden: true, max: examPoints_(e), submittedAt: a.submittedAt, status: a.status };   // 老師選擇不公布分數
  return { total: a.total, max: examPoints_(e), submittedAt: a.submittedAt, status: a.status,
           per: e.questions.map(function (q, i) { const s = a.scores[q.qid] || {}; return { no: i + 1, pct: s.pct || 0, pts: s.pts || 0, points: Number(q.points) || 0 }; }) };
}

function examWho() { const u = examUser_(); return { email: u.email, teacher: u.teacher, now: Date.now() }; }

/* 學生看到的考卷列表（老師會看到全部） */
function examList() {
  const u = examUser_(), now = Date.now();
  const all = examAll_();
  const att = {};
  attRows_(u.email).forEach(function (row) { const a = attRead_(row); att[a.examId] = a; });
  const mine = all.filter(function (e) { return u.teacher || examIsOpen_(e, now) || (att[e.id] && att[e.id].submittedAt); });
  return {
    now: now, email: u.email, teacher: u.teacher,
    exams: mine.map(function (e) {
      const a = att[e.id];
      return { id: e.id, title: e.title, status: e.status, open: examIsOpen_(e, now), startAt: e.startAt, endAt: e.endAt, limitMin: e.limitMin,
               nQ: e.questions.length, max: examPoints_(e), ruleHints: e.ruleHints,
               my: a ? { status: a.submittedAt ? 'submitted' : 'doing', total: e.hideScore ? null : a.total, startedAt: a.startedAt } : null, hideScore: e.hideScore };
    })
  };
}

/* 開始（或繼續）作答。回傳題目（不含答案）與目前進度 */
function examBegin(examId, name) {
  const u = examUser_(), now = Date.now();
  const e = examFind_(String(examId));
  if (!e) throw new Error('找不到這份考卷');
  const bank = bankGetMany_(e.questions.map(function (q) { return q.qid; }));
  const lock = LockService.getScriptLock(); lock.waitLock(30000);
  try {
    let f = attFind_(e.id, u.email);
    if (!f) {
      if (!examIsOpen_(e, now)) throw new Error('這份考卷目前沒有開放');
      const a = { examId: e.id, email: u.email, name: String(name || '').slice(0, 30), startedAt: now, savedAt: now, submittedAt: 0, answers: {}, scores: {}, total: 0, status: 'doing' };
      examSheet_(EXAM_CONFIG.ATT, EXAM_CONFIG.ATT_HEADERS).appendRow([a.examId, a.email, a.name, a.startedAt, a.savedAt, '', '{}', '{}', 0, 'doing']);
      f = attFind_(e.id, u.email);
    }
    let a = f.rec;
    if (name && !a.name) { a.name = String(name).slice(0, 30); attWrite_(f.row, a); }
    if (!a.submittedAt) {                                   // 已超過時限：以最後一次存檔的內容自動交卷
      const dl = examDeadline_(e, a);
      if (dl && now > dl + EXAM_CONFIG.GRACE_MS) {
        a = examFinalize_(e, bank, a, 'auto'); attWrite_(f.row, a);
      }
    }
    const base = { now: now, name: a.name, startedAt: a.startedAt };
    if (a.submittedAt) return Object.assign(base, { submitted: true, title: e.title, result: examResult_(e, a) });
    return Object.assign(base, {
      submitted: false,
      exam: { id: e.id, title: e.title, limitMin: e.limitMin, ruleHints: e.ruleHints, deadline: examDeadline_(e, a),
              questions: e.questions.map(function (q, i) { const p = bank[q.qid].puzzle; return { qid: q.qid, no: i + 1, points: Number(q.points) || 0, puzzle: p }; }) },
      answers: a.answers
    });
  } finally { lock.releaseLock(); }
}

function examSave(examId, answers) { return examStore_(String(examId), answers, false); }
function examSubmit(examId, answers) { return examStore_(String(examId), answers, true); }

function examStore_(examId, answers, submit) {
  const u = examUser_(), now = Date.now();
  const e = examFind_(examId);
  if (!e) throw new Error('找不到這份考卷');
  const lock = LockService.getScriptLock(); lock.waitLock(30000);
  try {
    const f = attFind_(examId, u.email);
    if (!f) throw new Error('尚未開始作答');
    const a = f.rec;
    if (a.submittedAt) return { submitted: true, result: examResult_(e, a), now: now };
    const dl = examDeadline_(e, a), late = dl && now > dl + EXAM_CONFIG.GRACE_MS;
    if (!late) a.answers = examLooseAnswers_(e, answers);           // 逾時後收到的內容不採用，沿用最後一次存檔
    a.savedAt = now;
    if (submit || late) {
      const bank = bankGetMany_(e.questions.map(function (q) { return q.qid; }));
      a.answers = examCleanAnswers_(e, bank, a.answers);
      examFinalize_(e, bank, a, late ? 'auto' : 'submitted');
      attWrite_(f.row, a);
      return { submitted: true, result: examResult_(e, a), now: now, auto: !!late && !submit };
    }
    // 一般存檔只改「最後存檔」與「作答」這兩欄（第 5～7 欄，中間是尚未交卷的空白），寫入量很小
    examSheet_(EXAM_CONFIG.ATT, EXAM_CONFIG.ATT_HEADERS).getRange(f.row, 5, 1, 3).setValues([[a.savedAt, '', JSON.stringify(a.answers)]]);
    return { submitted: false, now: now };
  } finally { lock.releaseLock(); }
}

/* 已超過時限（含寬限）卻還沒交卷的人，用他們最後一次存檔的內容自動交卷。
 * 學生關掉頁面或斷線時不會有人觸發，所以老師開成績／監考／匯出時一併處理。 */
function examSweep_(e) {
  const now = Date.now();
  const sh = examSheet_(EXAM_CONFIG.ATT, EXAM_CONFIG.ATT_HEADERS), last = sh.getLastRow();
  if (last < 2) return 0;
  const lock = LockService.getScriptLock(); lock.waitLock(30000);
  let n = 0;
  try {
    const vals = sh.getRange(2, 1, last - 1, EXAM_CONFIG.ATT_HEADERS.length).getValues();
    let bank = null;
    for (let i = 0; i < vals.length; i++) {
      if (String(vals[i][0]) !== e.id || vals[i][5]) continue;
      const a = attRecord_(vals[i]), dl = examDeadline_(e, a);
      if (!dl || now <= dl + EXAM_CONFIG.GRACE_MS) continue;
      if (!bank) bank = bankGetMany_(e.questions.map(function (q) { return q.qid; }));
      a.answers = examCleanAnswers_(e, bank, a.answers);
      examFinalize_(e, bank, a, 'auto');
      attWrite_(i + 2, a); n++;
    }
  } finally { lock.releaseLock(); }
  return n;
}

/* ---- 成績（老師） ---- */
function examResults(examId) {
  examNeedTeacher_();
  const e = examFind_(String(examId));
  if (!e) throw new Error('找不到這份考卷');
  examSweep_(e);
  const rows = examRows_(EXAM_CONFIG.ATT, EXAM_CONFIG.ATT_HEADERS).filter(function (r) { return String(r[0]) === e.id; }).map(attRecord_);
  return {
    exam: { id: e.id, title: e.title, max: examPoints_(e), questions: e.questions },
    students: rows.map(function (a) {
      return { email: a.email, name: a.name, status: a.submittedAt ? a.status : 'doing', total: a.submittedAt ? a.total : null, startedAt: a.startedAt,
               submittedAt: a.submittedAt, per: e.questions.map(function (q) { const s = a.scores[q.qid]; return s ? s.pts : null; }),
               pct: e.questions.map(function (q) { const s = a.scores[q.qid]; return s ? s.pct : null; }) };
    }).sort(function (x, y) { return x.email < y.email ? -1 : 1; })
  };
}

/* 把成績寫成一張可分享的試算表分頁（可複製「總分」欄貼到 Google Classroom 成績） */
function examExport(examId) {
  examNeedTeacher_();
  const r = examResults(examId);
  const ss = examSS_();
  let name = ('成績_' + r.exam.title).replace(/[\[\]\*\?\/\\:]/g, ' ').slice(0, 90);
  let sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name); else sh.clear();
  const head = ['Email', '姓名', '總分', '滿分', '狀態', '交卷時間'].concat(r.exam.questions.map(function (q, i) { return '第' + (i + 1) + '題(' + q.points + ')'; }));
  const stName = { submitted: '已交卷', auto: '時間到自動交卷', doing: '作答中' };
  const body = r.students.map(function (s) {
    return [s.email, s.name, s.total === null ? '' : s.total, r.exam.max, stName[s.status] || s.status,
            s.submittedAt ? Utilities.formatDate(new Date(s.submittedAt), DAILY_CONFIG.TZ, 'yyyy-MM-dd HH:mm') : ''].concat(s.per.map(function (v) { return v === null ? '' : v; }));
  });
  sh.getRange(1, 1, 1, head.length).setValues([head]);
  if (body.length) sh.getRange(2, 1, body.length, head.length).setValues(body);
  sh.setFrozenRows(1);
  return { url: ss.getUrl() + '#gid=' + sh.getSheetId(), sheet: name, count: body.length };
}


/* ---- 監考（老師）：目前作答中／已交卷的人，與每個人最後一次存檔的時間 ---- */
function examMonitor(examId) {
  examNeedTeacher_();
  const e = examFind_(String(examId));
  if (!e) throw new Error('找不到這份考卷');
  examSweep_(e);
  const now = Date.now();
  const rows = examRows_(EXAM_CONFIG.ATT, EXAM_CONFIG.ATT_HEADERS).filter(function (r) { return String(r[0]) === e.id; }).map(attRecord_);
  const st = rows.map(function (a) {

const MOCK = HAS_GAS ? null : makeMockServer();

function gs(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((ok, fail) => {
    if (HAS_GAS) {
      const r = google.script.run.withSuccessHandler(ok).withFailureHandler(e => fail(new Error(e && e.message ? e.message : String(e))));
      r[fn].apply(r, args);
    } else {
      setTimeout(() => {
        try {
          const v = MOCK[fn].apply(null, JSON.parse(JSON.stringify(args)));
          MOCK.save();
          ok(v === undefined ? null : JSON.parse(JSON.stringify(v)));
        } catch (e) { fail(e); }
      }, 30);
    }
  });
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtT = ms => ms ? new Date(ms + 8 * 3600e3).toISOString().slice(5, 16).replace('T', ' ') : '';
const pctTxt = v => Math.round(v * 100) + '%';
const ex = { me: null, list: [], cur: null, timer: 0, saveT: 0, tab: 'bank', bank: [], off: 0, rules: false };
let exRules = false;

/* ---------- 共用：目前盤面、填寫進度 ---------- */
function exFlat() { return state.map(r => r.join('')).join(''); }
function exFill(q, s) {
  const p = q.puzzle, n = p.size, g = new Set(p.givens.map(x => x.r * n + x.c));
  let tot = 0, f = 0;
  for (let i = 0; i < n * n; i++) { if (g.has(i)) continue; tot++; if (s && s.charAt(i) && s.charAt(i) !== '0') f++; }
  return tot ? f / tot : 1;
}
function exSyncCur() {
  const c = ex.cur; if (!c || c.loaded == null) return;
  c.ans[c.qs[c.loaded].qid] = exFlat();
}

function exStart(id) {

        } }]);

function exEnter(res) {
  if (res.submitted) { exShowResult(res.title, res.result); return; }
  const X = res.exam;
  ex.cur = { id: X.id, title: X.title, qs: X.questions, ans: Object.assign({}, res.answers), loaded: null, idx: 0, deadline: X.deadline,
             off: res.now - Date.now(), st: res.startedAt, rules: X.ruleHints, preview: false, dirty: false, saving: false, lastSave: Date.now() - Math.random() * 25000 };
  const bk = exBackup(X.id);
  if (bk && bk.dirty && bk.st === res.startedAt) { Object.assign(ex.cur.ans, bk.ans); ex.cur.dirty = true; }
  exPlay();
}
function exPlay() {
  mode = 'exam'; showView('game');
  exRules = ex.cur.rules;
  exLoadQ(0);
  clearInterval(ex.timer); ex.timer = setInterval(exTick, 1000); exTick();
  toast('點上方的題號，可以自己選要先做哪一題');
}
function exLoadQ(i) {
  const c = ex.cur; exSyncCur();
  c.idx = i; const q = c.qs[i], n = q.puzzle.size;
  setPuzzle(q.puzzle);
  const s = c.ans[q.qid];
  if (s && s.length === n * n) for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (!locked[r][k]) state[r][k] = +s.charAt(r * n + k);
  c.loaded = i;
  $('seedinfo').textContent = '第 ' + (i + 1) + ' 題　' + n + '×' + n + '　配分 ' + q.points + ' 分';
  $('techinfo').textContent = '';

}
function exChips() {
  const c = ex.cur; if (!c) return;
  let h = '';
  c.qs.forEach((q, i) => {
    const f = exFill(q, i === c.loaded ? exFlat() : c.ans[q.qid]);
    h += '<button class="exchip' + (i === c.idx ? ' cur' : '') + (f >= 1 ? ' full' : '') + '" data-q="' + i + '"><b>' + (i + 1) + '</b><span>' + pctTxt(f) + '</span></button>';
  });
  $('exChips').innerHTML = h;
  $('exPrev').disabled = c.idx === 0; $('exNext').disabled = c.idx === c.qs.length - 1;
}
function exTick() {
  const c = ex.cur; if (!c) return;
  const el = $('exTimer');
  if (!c.preview && Date.now() - (c.lastSave || 0) > 45000) exSaveNow(true);   // 每 45 秒存一次（心跳），老師端才看得到「還在線上」
  if (!c.deadline || c.preview) { el.textContent = c.preview ? '預覽（不計分）' : '不限時'; el.classList.remove('low'); return; }
  const left = c.deadline - (Date.now() + c.off);
  if (left <= 0) { clearInterval(ex.timer); el.textContent = '時間到'; toast('時間到，自動交卷'); exSubmit(true); return; }
  const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
  el.textContent = '⏱ ' + m + ':' + (s < 10 ? '0' : '') + s; el.classList.toggle('low', left < 5 * 60000);
}

/* ---------- 存檔 ---------- */
function exBackup(id) { try { return JSON.parse(lsGet('bs_exam_bk_' + id) || 'null'); } catch (e) { return null; } }
function exChanged() {
  const c = ex.cur; if (!c) return;
  c.dirty = true; exChips();
  clearTimeout(ex.saveT); ex.saveT = setTimeout(() => exSaveNow(), 8000 + Math.random() * 4000);   // 錯開時間，避免全班同一秒存檔
  exSyncCur(); lsSet('bs_exam_bk_' + c.id, JSON.stringify({ dirty: true, st: c.st, ans: c.ans }));
}
function exSaveNow(force) {
  const c = ex.cur; if (!c || c.preview) return Promise.resolve();
  if (!c.dirty && force !== true) return Promise.resolve();          // 沒有新的作答就不必存（只有定時「心跳」會強制存）
  if (c.saving) return Promise.resolve();                              // 上一次還在存，結束後會自動補存
  clearTimeout(ex.saveT); exSyncCur();
  const ans = Object.assign({}, c.ans), hadDirty = c.dirty;
  c.dirty = false; c.saving = true;
  lsSet('bs_exam_bk_' + c.id, JSON.stringify({ dirty: true, st: c.st, ans }));
  return gs('examSave', c.id, ans).then(r => {
    c.saving = false; c.lastSave = Date.now();
    if (r.submitted && ex.cur === c) { clearInterval(ex.timer); ex.cur = null; exShowResult(c.title, r.result); toast('時間已到，已自動交卷'); return; }
    if (!c.dirty) lsSet('bs_exam_bk_' + c.id, JSON.stringify({ dirty: false }));
    else exSaveNow();                                                  // 存檔期間又有新的作答
  }).catch(() => {
    c.saving = false; c.dirty = c.dirty || hadDirty;
    toast('網路不穩，作答先存在這台裝置，之後會再試');
    clearTimeout(ex.saveT); ex.saveT = setTimeout(() => exSaveNow(true), 8000 + Math.random() * 4000);
  });
}

    '<br>交卷後就不能再修改。<div class="exrows">' + rows + '</div>', [{ text: '繼續作答' }, { text: '交卷', primary: true, fn: () => { hideDlg(); exSubmit(false); } }]);

function exSubmit() {

  }
  gs('examSubmit', c.id, Object.assign({}, c.ans)).then(r => {
    ex.cur = null; lsSet('bs_exam_bk_' + c.id, JSON.stringify({ dirty: false }));

function edPaint() {
  const e = ed, g = $('edGrid'); g.innerHTML = '';

    for (let c = 0; c < e.n; c++) {
      const t = e.cells[r][c], d = document.createElement('div'); d.className = 'cell' + (t ? ' locked' : ''); d.title = ED_NAMES[t];
      if (t) paintCell(d, t === 'water' ? 1 : 2, false, false, false, false, t, false);
      d.addEventListener('click', () => { e.cells[r][c] = ED_TYPES[(ED_TYPES.indexOf(e.cells[r][c]) + 1) % ED_TYPES.length]; edPaint(); });
      g.appendChild(d);
    }
    g.appendChild(edNum(e.rc, r));

  for (let c = 0; c < e.n; c++) g.appendChild(edNum(e.cc, c));
}
function edNum(arr, i) {

  x.addEventListener('input', () => { arr[i] = Math.max(0, Math.min(ed.n, parseInt(x.value, 10) || 0)); });
  return x;
}
function edPuzzle() {
  const e = ed, fleet = {};
  document.querySelectorAll('.edf').forEach(i => { const v = parseInt(i.value, 10) || 0; if (v > 0) fleet[+i.dataset.l] = v; e.fleet[+i.dataset.l] = v; });
  e.name = $('edName').value;
  const givens = [];
  for (let r = 0; r < e.n; r++) for (let c = 0; c < e.n; c++) if (e.cells[r][c]) givens.push({ r, c, type: e.cells[r][c] });
  return { size: e.n, rowCounts: e.rc.slice(), colCounts: e.cc.slice(), fleet, givens };
}
function edVerify(cb) {
  const p = edPuzzle(), msg = $('edMsg');
  const sum = a => a.reduce((s, v) => s + v, 0), shipCells = Object.keys(p.fleet).reduce((s, L) => s + L * p.fleet[L], 0);
  if (!Object.keys(p.fleet).length) { msg.className = 'exhint bad'; msg.textContent = '船隊不能是空的。'; return; }
  if (sum(p.rowCounts) !== sum(p.colCounts) || sum(p.rowCounts) !== shipCells) {
    msg.className = 'exhint bad'; msg.textContent = '數字不一致：行總和 ' + sum(p.rowCounts) + '、列總和 ' + sum(p.colCounts) + '、船隊共 ' + shipCells + ' 格，三者必須相同。'; return;
  }
  msg.className = 'exhint'; msg.textContent = '驗證中…';
  setTimeout(() => {
    const res = solve(p, 2, 3000000);
    if (res.aborted) { msg.className = 'exhint bad'; msg.textContent = '題目太難，無法在時限內確認答案是否唯一，請多加提示。'; return; }
    if (res.count === 0) { msg.className = 'exhint bad'; msg.textContent = '這題沒有解，請檢查行列數字、船隊與提示。'; return; }
    if (res.count > 1) { msg.className = 'exhint bad'; msg.textContent = '這題有多組解，請多加提示讓答案唯一。'; return; }
    const t = rate(p).tier;
    msg.className = 'exhint good'; msg.innerHTML = '✔ 答案唯一。難度：' + exTagOf(t) + '　提示 ' + p.givens.length + ' 格';
    if (cb) cb(p);
  }, 30);
}
function edSave() {

function ebRandGo() {
  ebRead();
  const sz = +$('rSize').value, tr = +$('rTier').value, cnt = Math.max(1, +$('rCnt').value || 1), used = new Set(eb.qs.map(q => q.qid));
  const pool = ex.bank.filter(b => !used.has(b.id) && (!sz || b.size === sz) && (tr < 0 || b.tier === tr));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  const pick = pool.slice(0, cnt);
  if (pick.length < cnt) toast('符合條件的題目只有 ' + pick.length + ' 題');
  pick.forEach(b => eb.qs.push({ qid: b.id, points: 10 }));
  ebRender();
}
const P30 = [
  { size: 6, tier: 1, level: 'easy', pts: 15 }, { size: 6, tier: 1, level: 'easy', pts: 15 },
  { size: 7, tier: 2, level: 'medium', pts: 20 }, { size: 7, tier: 2, level: 'medium', pts: 20 },
  { size: 8, tier: 3, level: 'hard', pts: 30 }];
function ebPreset30(retried) {
  ebRead();
  const used = new Set(), picks = [], miss = [];
  P30.forEach(p => {
    const pool = ex.bank.filter(b => !used.has(b.id) && b.size === p.size && b.tier === p.tier);
    if (pool.length) { const b = pool[Math.floor(Math.random() * pool.length)]; used.add(b.id); picks.push({ qid: b.id, points: p.pts }); }
    else miss.push(p);
  });
  const apply = () => { eb.limitMin = 30; eb.qs = picks; ebRender(); toast('已套用 30 分鐘建議配置（' + picks.length + ' 題）'); };
  if (!miss.length || retried) { apply(); if (miss.length) toast('題庫仍缺 ' + miss.length + ' 題，請到題庫手動出題後再補'); return; }
  showDlg('題庫題目不夠', '這個配置還缺 <b>' + miss.length + '</b> 題。要自動出題補齊嗎？每題約需數秒到十幾秒。', [
    { text: '不用，先放入現有的', fn: () => { hideDlg(); apply(); } },
    { text: '自動補齊', primary: true, fn: () => {
        showDlg('出題中…', '請稍候，不要關閉頁面。', []);
        miss.reduce((pr, p) => pr.then(() => gs('bankGenerate', p.size, p.level, 1)), Promise.resolve())
          .then(() => gs('bankList')).then(b => { ex.bank = b; hideDlg(); ebPreset30(true); })
          .catch(e => { hideDlg(); toast(e.message || String(e)); });
      } }]);
}

$('exChips').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) { exLoadQ(+b.dataset.q); exSaveNow(); } });
$('exPrev').addEventListener('click', () => { exLoadQ(ex.cur.idx - 1); exSaveNow(); });
$('exNext').addEventListener('click', () => { exLoadQ(ex.cur.idx + 1); exSaveNow(); });
$('exSubmit').addEventListener('click', exAskSubmit);
$('exReset').addEventListener('click', () => {
  showDlg('清除這一題？', '這一題的作答會全部清空。', [{ text: '取消' }, { text: '清除', primary: true, fn: () => { hideDlg(); for (let r = 0; r < puzzle.size; r++) for (let k = 0; k < puzzle.size; k++) if (!locked[r][k]) state[r][k] = 0; render(); exChanged(); } }]);
});
$('navExam').addEventListener('click', goExam);


/* ============ 事件與初始化 ============ */
$('navCal').addEventListener('click', () => { if (mode === 'cal') { loadCalendar(); } else goCal(); });
$('navPrac').addEventListener('click', goPractice);
$('backCal').addEventListener('click', goCal);
$('winBack').addEventListener('click', () => { $('win').classList.remove('show'); goCal(); });
$('winStay').addEventListener('click', () => $('win').classList.remove('show'));
$('dreset').addEventListener('click', () => {
  const rec = prog.days[dailyDate] || {};
  setPuzzle(dailyData.puzzle);
  solvedHandled = !!rec.d;                 // 已完成過的日子重玩不會重複計入
  if (!rec.d) { rec.b = ser(); persist(); }
  render();
});
$('mPrev').addEventListener('click', () => { const p = cal.month.split('-').map(Number); cal.month = new Date(Date.UTC(p[0], p[1] - 2, 1)).toISOString().slice(0, 7); renderCal(); });
$('mNext').addEventListener('click', () => { const p = cal.month.split('-').map(Number); cal.month = new Date(Date.UTC(p[0], p[1], 1)).toISOString().slice(0, 7); renderCal(); });

sizeSel.addEventListener('change', () => { seedInput.value = ''; fillLvl(); start(); });
lvlSel.addEventListener('change', () => { seedInput.value = ''; start(); });
$('gen').addEventListener('click', () => { seedInput.value = ''; start(); });
$('reset').addEventListener('click', () => { setPuzzle(puzzle); });
$('ans').addEventListener('click', checkAnswer);
window.addEventListener('resize', () => { if (puzzle && mode !== 'cal') render(); });

showView('cal');
loadCalendar();
if (!lsGet('bs_tut_seen')) openTut();
</script>
