<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>發現小船 Battleships</title>
<style>
  :root { --navy:#0f2a4a; --sea:#2563c9; --ink:#1b2430; --muted:#6b7a8c; --bg:#eef3f8;
          --easy:#2e9e5b; --medium:#d68a00; --hard:#c0392b; --expert:#5b2a86; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font-family: "Noto Sans TC", sans-serif; margin: 0; padding: 6px 14px 12px; background: var(--bg); color: var(--ink);
         display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 520px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 4px; color: var(--navy); letter-spacing: 1px; }
  #nav { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  .navbtn { border: 1px solid #c3d0de; background: #fff; border-radius: 20px; padding: 6px 14px; font-size: 15px; color: var(--navy); }
  .navbtn.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  section { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; }
  button, select, input { font-size: 16px; padding: 6px 12px; font-family: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .55; }

  /* ---- 月曆 ---- */
  .ban { width: 100%; border-radius: 10px; padding: 5px 12px; font-size: 14px; line-height: 1.4; margin-bottom: 4px; }
  .ban.ok { background: #e3f6ea; color: #1b6b3a; }
  .ban.lock { background: #fff1dc; color: #8a5200; }
  .ban button { font-size: 13px; padding: 3px 10px; margin-left: 4px; border-radius: 14px; border: 1px solid #d9a24a; background: #fff; }
  #calStats { font-size: 13px; color: var(--muted); margin: 2px 0 6px; text-align: center; }
  #calHead { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: var(--calw, 420px); margin: 2px 0 6px; }
  #calHead button { width: 40px; height: 36px; padding: 0; font-size: 22px; border-radius: 10px; border: 1px solid #c3d0de; background: #fff; }
  #mTitle { font-size: 18px; font-weight: 700; color: var(--navy); }
  #calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; max-width: var(--calw, 420px); }
  .wd { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0; }
  .day { position: relative; aspect-ratio: 1 / 1.05; border: none; border-radius: 11px; padding: 0; color: #fff; overflow: hidden;
         display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform .15s, box-shadow .15s; }
  .day { gap: 2px; }
  .day .num { font-size: 16px; font-weight: 800; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .day .mark { font-size: 13px; line-height: 1; }
  .day .chip { font-size: 9px; font-weight: 700; letter-spacing: 1px; line-height: 1; }
  .st-today .num { margin-top: 5px; }
  .day .ribbon { position: absolute; top: 0; right: 0; background: #ffd23f; color: #5a3d00; font-size: 9px; font-weight: 800; padding: 1px 6px; border-bottom-left-radius: 8px; }
  .day:not(:disabled):hover { transform: translateY(-2px); }
  .st-today, .st-past { background: linear-gradient(160deg, #1d4ed8, #0e7490);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.3), 0 2px 6px rgba(20,60,120,.35); }
  .st-today { background: linear-gradient(160deg, #7c3aed, #2563eb); animation: pulse 2.2s ease-in-out infinite; }
  .st-locked { background: linear-gradient(160deg, #7b8794, #55616e); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
  .st-future { background: #e3e8ee; color: #a3adb9; cursor: not-allowed; }
  .st-future .num { text-shadow: none; }
  .st-before { background: transparent; color: #c4ccd4; cursor: default; }
  .st-before .num { text-shadow: none; font-weight: 500; }
  .st-ontime { background: linear-gradient(160deg, #f8cb5a, #e09a1a); box-shadow: inset 0 0 0 1px rgba(255,255,255,.45), 0 2px 6px rgba(190,130,20,.4); }
  .st-late { background: linear-gradient(160deg, #bfc9d3, #8e9aa6); box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
  .st-today::after, .st-past::after { content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none;
        background: radial-gradient(circle at 25% 130%, rgba(255,255,255,.28) 0 34%, transparent 35%),
                    radial-gradient(circle at 80% 140%, rgba(255,255,255,.2) 0 38%, transparent 39%); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(124,58,237,.45), 0 2px 6px rgba(20,60,120,.35); }
                     50% { box-shadow: 0 0 0 6px rgba(124,58,237,0), 0 2px 6px rgba(20,60,120,.35); } }
  #legend { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 6px; max-width: var(--calw, 420px); }
  #legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }
  #calFoot { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; max-width: var(--calw, 420px); line-height: 1.4; }
  #calErr { color: #b3261e; font-size: 14px; text-align: center; margin: 10px 0; }

  /* ---- 棋盤 ---- */
  #rules { font-size: 12px; line-height: 1.4; color: #666; max-width: 460px; text-align: center; margin-bottom: 2px; }
  .bar { display: flex; gap: 8px; margin: 4px 0; flex-wrap: wrap; justify-content: center; align-items: center; }
  #seed { width: 120px; }
  #hints { width: 130px; }
  #gameView { width: var(--bw, 360px); max-width: 100%; display: flex; flex-direction: column; align-items: center; }
  #gameView[hidden] { display: none; }
  #gameView button, #gameView select, #gameView input { font-size: 14px; padding: 4px 8px; }
  #gameView .bar { margin: 3px 0; gap: 6px; width: 100%; }
  #practiceBar { width: 100%; }
  #lvl { flex: 1 1 120px; min-width: 0; }
  #size { flex: 0 0 74px; }
  #hints, #seed { width: 0; flex: 1 1 70px; min-width: 0; }
  #infoline { display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: center; align-items: center; }
  #grid { display: grid; margin: 4px 0; }
  .cell { width: var(--cs); height: var(--cs); border: 1px solid #888; background: #fff; position: relative;
          cursor: pointer; user-select: none; -webkit-user-select: none;
          display: flex; align-items: center; justify-content: center; }
  .cell.water { background: #dff1fb; color: #4aa3d8; font-size: calc(var(--cs) * 0.5); }
  .cell.locked { cursor: default; box-shadow: inset 0 0 0 2px #d6a400; }
  .cell.wrong { background: #ffd9d4; box-shadow: inset 0 0 0 3px #d93025; }
  .cell.hl { box-shadow: inset 0 0 0 3px #2e9e5b; }
  .ship { position: absolute; background: #111; z-index: 1; }
  .cell.bad .ship { background: #c0392b; }
  .lab { width: var(--cs); height: var(--cs); display: flex; align-items: center; justify-content: center;
         font-size: calc(var(--cs) * 0.4); font-weight: bold; color: #333; }
  .lab.ok { color: #1e9e4a; }
  .lab.over { color: #d02020; }
  #seedinfo { font-size: 14px; color: #333; font-weight: bold; text-align: center; }
  #techinfo { font-size: 13px; color: #666; text-align: center; }
  #fleet { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 6px 16px; margin: 4px 0; min-height: 24px; --fs: 18px; }
  .fgrp { display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
  .fgrp .row { display: flex; gap: 5px; }
  .fic { display: flex; gap: 1px; transition: opacity .2s; }
  .fic.used { opacity: .18; }
  .fg { width: var(--fs); height: var(--fs); background: #111; }
  .fg.l { border-radius: 50% 0 0 50%; } .fg.r { border-radius: 0 50% 50% 0; } .fg.s { border-radius: 50%; }
  .fgrp.over .fg { background: #c0392b; }
  .fbadge { position: absolute; top: -8px; right: -10px; background: #c0392b; color: #fff; font-size: 11px; border-radius: 9px; padding: 0 5px; }
  #msg { font-size: 17px; min-height: 24px; font-weight: bold; text-align: center; max-width: 460px; }
  #msg.win { color: #1e9e4a; }
  #msg.warn { color: #b26a00; font-size: 15px; }

  /* ---- 共用：標籤、對話框、提示 ---- */
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; color: #fff; vertical-align: 1px; }
  .t1 { background: var(--easy); } .t2 { background: var(--medium); } .t3 { background: var(--hard); } .t0 { background: var(--expert); }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
  .overlay.show { display: flex; }
  .card { background: #fff; border-radius: 14px; max-width: 360px; width: 100%; padding: 18px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .card h3 { margin: 0 0 8px; font-size: 19px; }
  .card .sub { font-size: 14px; color: #444; line-height: 1.6; }
  .cardbtns { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .cardbtns button { border-radius: 10px; border: 1px solid #c3d0de; background: #fff; }
  .cardbtns button.primary { background: var(--sea); color: #fff; border-color: var(--sea); }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: rgba(20,30,45,.92); color: #fff;
           padding: 9px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: all .25s; z-index: 90; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 60; pointer-events: none; opacity: .95;
              animation: fall var(--d, 2.6s) ease-in var(--delay, 0s) forwards; }
  @keyframes fall { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 540deg)); opacity: .9; } }

  /* ---- 揭開封面過場動畫 ---- */
  .stage { position: fixed; inset: 0; z-index: 80; background: rgba(8,20,40,.62); cursor: pointer; }
  .stagecard { position: absolute; perspective: 1100px; }
  .reveal { position: absolute; inset: 0; border-radius: 18px; background: linear-gradient(170deg, #fff, #e8f1fb); display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .reveal .rdate { font-size: 52px; font-weight: 800; color: var(--navy); line-height: 1; }
  .reveal .rwd { font-size: 15px; color: var(--muted); }
  .reveal .rlv { margin: 8px 0 2px; } .reveal .rlv .tag { font-size: 17px; padding: 3px 16px; border-radius: 16px; }
  .reveal .rinfo { font-size: 16px; color: #333; }
  .reveal .rtip { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .reveal .rload { font-size: 16px; color: var(--muted); }
  .door { position: absolute; inset: 0; border-radius: 18px; transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden;
          background: linear-gradient(160deg, #7c3aed, #2563eb 60%, #0e7490); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
          box-shadow: inset 0 0 0 4px rgba(255,255,255,.35), 6px 0 24px rgba(0,0,0,.35); overflow: hidden; }
  .door::after { content: ""; position: absolute; inset: 0; opacity: .5; background:
          radial-gradient(circle at 25% 130%, rgba(255,255,255,.28) 0 34%, transparent 35%), radial-gradient(circle at 80% 140%, rgba(255,255,255,.2) 0 38%, transparent 39%); }
  .door .dnum { font-size: 88px; font-weight: 800; line-height: 1; text-shadow: 0 3px 8px rgba(0,0,0,.35); }
  .door .danchor { font-size: 34px; margin-top: 6px; }
  .door .dknob { position: absolute; right: 16px; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #ffd23f; box-shadow: 0 0 0 3px rgba(0,0,0,.2); }

  /* ---- 教學視窗 ---- */
  #tut { z-index: 70; }
  /* 過關動畫 */
  #cele { position: fixed; inset: 0; z-index: 75; display: none; flex-direction: column; align-items: center; padding: 8px 10px 12px;
          background: radial-gradient(ellipse at 50% 30%, #1b4f86 0%, #0b2a4d 55%, #061528 100%); color: #fff; }
  #cele.show { display: flex; }
  #ceTop { align-self: stretch; display: flex; gap: 8px; justify-content: flex-end; z-index: 3; }
  #ceTop button { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 16px; padding: 4px 12px; font-size: 14px; }
  #ceTop button[hidden] { display: none; }
  #ceStage { flex: 1 1 0; min-height: 0; width: 100%; position: relative; display: flex; align-items: center; justify-content: center;
             perspective: 1100px; perspective-origin: 50% 38%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  #ceB3 { transform-style: preserve-3d; will-change: transform; }
  .ce-wrap, .ce-cols { display: grid; transform-style: preserve-3d; position: relative; }
  .ce-c { background-repeat: no-repeat; border: 1px solid rgba(255,255,255,.55); position: relative; transform-style: preserve-3d; }
  .ce-c i { position: absolute; inset: 1px; background: #111; }
  .ce-n, .ce-cn { display: flex; align-items: center; justify-content: center; font-weight: 700; color: rgba(255,255,255,.55); transition: color .3s, transform .3s; font-size: 15px; }
  .ce-cn { height: 26px; }
  .ce-n.ok, .ce-cn.ok { color: #62e0a0; transform: scale(1.15); }
  .ce-n.ok::after, .ce-cn.ok::after { content: "✓"; font-size: 11px; margin-left: 1px; }
  .ce-ship { position: absolute; width: 0; height: 0; transform-style: preserve-3d; pointer-events: none; }
  .ce-bb { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0; }
  .ce-bb img { position: absolute; display: block; max-width: none; user-select: none; -webkit-user-drag: none; }
  .ce-glow { position: absolute; border-radius: 50%; opacity: 0; pointer-events: none; }
  #ceFx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 2; }
  .ce-conf { position: absolute; top: -14px; width: 8px; height: 12px; opacity: 0; }
  .ce-boat { position: absolute; left: 0; bottom: 30%; max-width: none; }
  #ceHint { font-size: 13px; color: rgba(255,255,255,.7); margin: 4px 0; opacity: 0; transition: opacity .5s; min-height: 18px; }
  #ceHint.in { opacity: 1; }
  #ceCard { background: #fff; color: #10243e; border-radius: 14px; padding: 12px 20px; text-align: center; width: min(92vw, 380px); min-height: 138px;
            opacity: 0; transform: translateY(14px) scale(.96); transition: opacity .5s, transform .5s; pointer-events: none; z-index: 3; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  #ceCard.in { opacity: 1; transform: none; pointer-events: auto; }
  #ceCard h3 { margin: 0 0 4px; font-size: 21px; }
  #cele.k-late #ceCard { background: #eef1f5; }
  #cele.k-ontime #ceCard { border: 2px solid #f0b429; }
  .fname { font-size: 11px; color: #567; line-height: 1; margin-top: 1px; white-space: nowrap; }

  #tutcard { background: #fff; border-radius: 12px; max-width: 540px; width: 100%; max-height: calc(100vh - 24px); overflow: auto;
             padding: 18px 18px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  #tutcard h2 { margin: 0 0 8px; font-size: 19px; }
  #tutcard { display: flex; flex-direction: column; }
  #tutbody { flex: 1 1 auto; font-size: 15px; line-height: 1.55; }
  #tutbody p { margin: 6px 0; }
  .minirow { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .minibox { text-align: center; margin: 6px 10px; }
  .minibox .cap { font-size: 13px; color: #555; max-width: 220px; margin: 4px auto 0; line-height: 1.45; }
  .mini { display: grid; width: max-content; margin: 0 auto; }
  .mini .cell { cursor: default; }
  .mini.live .cell:not(.locked) { cursor: pointer; }
  .tutfleet { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; --fs: 16px; }
  .tutfleet .fgrp { align-items: center; }
  #tutnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  #dots { display: flex; gap: 6px; }
  #dots span { width: 9px; height: 9px; border-radius: 50%; background: #cfd6dc; }
  #dots span.on { background: #2563c9; }
  #tutskip { background: none; border: none; color: #666; text-decoration: underline; padding: 6px; }
  #tutnever { font-size: 13px; color: #555; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
  #tutnever input { width: auto; padding: 0; }

  @media (prefers-reduced-motion: reduce) { .st-today { animation: none; } .confetti { display: none; } }

  /* ---- 測驗（月曆上的標記與提示） ---- */
  .ban.ex { background: #fde8ec; color: #9b1c31; }
  .ban.ex button { border: 1px solid #d96a7e; background: #fff; border-radius: 14px; font-size: 13px; padding: 3px 12px; margin-left: 6px; }
  .day.hasexam { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #e11d48; }
  .day .exm { position: absolute; left: 3px; top: 2px; font-size: 12px; line-height: 1; }
  /* ---- 測驗 ---- */
  body.exam *, body.exam *::before, body.exam *::after { animation: none !important; transition: none !important; }
  body.exam #navSnd { display: none; }
  #examView { width: 100%; max-width: 560px; align-items: stretch; }
  .exhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0 8px; }
  .exhead h2 { margin: 0; font-size: 19px; color: var(--navy); }
  .exnote, .exhint { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 4px 0 8px; }
  .exhint.bad { color: #b3261e; font-weight: 700; } .exhint.good { color: #1e7d3e; font-weight: 700; }
  .exmsg { text-align: center; color: var(--muted); padding: 24px 8px; } .exmsg.err { color: #b3261e; }
  .excard, .expanel { background: #fff; border: 1px solid #d5e0ec; border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; }
  .excard .t { font-weight: 700; font-size: 16px; color: var(--navy); }
  .excard .m { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .act { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  #examView button, #examBar button { border: 1px solid #c3d0de; background: #fff; border-radius: 10px; font-size: 14px; padding: 5px 12px; }
  #examView button.primary, #examBar button.primary { background: var(--sea); color: #fff; border-color: var(--sea); }
  #examView button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  #examView input, #examView select { font-size: 14px; padding: 4px 8px; border: 1px solid #c3d0de; border-radius: 8px; }
  .exb { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: #e3e8ee; color: #55616e; }
  .exb.ok, .exb.open { background: #e3f6ea; color: #1b6b3a; } .exb.doing { background: #fff1dc; color: #8a5200; }
  .extabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .exinline { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin: 6px 0; font-size: 14px; }
  .exlist { max-height: 300px; overflow: auto; margin: 6px 0; }
  .exitem { display: block; padding: 4px 2px; font-size: 14px; border-bottom: 1px solid #eef2f6; } .exitem small { color: var(--muted); }
  .ebq { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid #eef2f6; font-size: 14px; }
  .ebq .n { width: 22px; font-weight: 700; } .ebq .nm { flex: 1; min-width: 0; } .ebp { width: 64px; }
  .ebq button { padding: 2px 8px !important; }
  .exscore { text-align: center; font-size: 22px; margin: 10px 0; } .exscore b { font-size: 44px; color: var(--navy); }
  .exres { background: #fff; border: 1px solid #d5e0ec; border-radius: 12px; padding: 8px 12px; }
  .exrr { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; }
  .exrr > span:first-child { width: 58px; } .exrr > span:last-child { width: 70px; text-align: right; }
  .exbar { flex: 1; height: 10px; border-radius: 5px; background: #e3e8ee; overflow: hidden; } .exbar i { display: block; height: 100%; background: var(--sea); }
  .exrows { text-align: left; max-height: 180px; overflow: auto; margin-top: 8px; font-size: 14px; }
  .exrow { padding: 2px 0; border-bottom: 1px solid #eef2f6; }
  .extbl { overflow: auto; } .extbl table { border-collapse: collapse; font-size: 13px; width: 100%; }
  .extbl th, .extbl td { border: 1px solid #d5e0ec; padding: 3px 6px; text-align: center; white-space: nowrap; } .extbl th { background: #eef3f8; }
  .edgrid { display: grid; margin: 6px auto; }
  .edgrid .edin { width: var(--cs); height: var(--cs); padding: 0; text-align: center; font-size: calc(var(--cs) * .45); font-weight: 700; border: none; background: transparent; -moz-appearance: textfield; }
  .edf { width: 48px; }
  #examBar { width: 100%; }

<script>
/* ================= 船隊設定 =================
 * 6×6 沿用附件；8×8 以上用標準船隊（4×1, 3×2, 2×3, 1×4，共 20 格）。
 * 7×7 我自訂為 14 格，想改可以直接改這裡。
 */
const FLEETS = {
  6:  { 3: 1, 2: 2, 1: 3 },
  7:  { 4: 1, 3: 1, 2: 2, 1: 3 },
  8:  { 4: 1, 3: 2, 2: 3, 1: 4 },
  9:  { 4: 1, 3: 2, 2: 3, 1: 4 },
  10: { 4: 1, 3: 2, 2: 3, 1: 4 }
};

/* ================= 難度設定 =================
 * tier  : 解題需要的最高技巧等級（0 = 需要猜測／試錯）
 * lo/hi : 預填格（提示）數量範圍，單位是「棋盤邊長的倍數」
 *         例如 8×8 簡單：0.9×8≈7 到 1.5×8=12 格
 * 想調整每個難度的提示多寡，改這裡的 lo / hi 即可。
 */
const LEVELS = {
  easy:   { name: '簡單', tier: 1, lo: 0.9,  hi: 1.5  },
  medium: { name: '中等', tier: 2, lo: 0.5,  hi: 0.9  },
  hard:   { name: '困難', tier: 3, lo: 0.25, hi: 0.5  },
  expert: { name: '專家', tier: 0, lo: 0,    hi: 0    }   // 專家：提示降到唯一解所需的最少，可能要試錯
};
const TIER_NAME = { 0: '專家（需試錯）', 1: '簡單', 2: '中等', 3: '困難' };

function hintRange(L, n) {
  const lo = Math.round(L.lo * n);
  return [lo, Math.max(lo, Math.round(L.hi * n))];
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* ================= 隨機擺船（船與船八方向不相鄰） ================= */
function freeAround(g, n, y, x) {
  for (let dy = -1; dy <= 1; dy++)
    for (let dx = -1; dx <= 1; dx++) {
      const ny = y + dy, nx = x + dx;
      if (ny >= 0 && nx >= 0 && ny < n && nx < n && g[ny][nx]) return false;
    }
  return true;
}

function placeFleet(n, fleet, rng) {
  const lens = [];
  Object.keys(fleet).map(Number).sort((a, b) => b - a)
    .forEach(l => { for (let i = 0; i < fleet[l]; i++) lens.push(l); });
  for (let attempt = 0; attempt < 500; attempt++) {
    const g = Array.from({ length: n }, () => Array(n).fill(0));
    let ok = true;
    for (const L of lens) {
      let placed = false;
      for (let t = 0; t < 200 && !placed; t++) {
        const horiz = rng() < 0.5;
        const r = Math.floor(rng() * (horiz ? n : n - L + 1));
        const c = Math.floor(rng() * (horiz ? n - L + 1 : n));
        const cells = [];
        for (let k = 0; k < L; k++) cells.push(horiz ? [r, c + k] : [r + k, c]);
        if (cells.every(p => freeAround(g, n, p[0], p[1]))) {
          cells.forEach(p => { g[p[0]][p[1]] = 1; });
          placed = true;
        }
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) return g;
  }
  return null;
}

/* ================= 提示格的形狀 =================
 * water  水
 * single 單格船（圓形，四周皆水）
 * up/down/left/right 船頭（半圓，圓的一側是船的盡頭）
 * mid    船身（方塊，兩側同一軸都是船）
 * ship   確定是船，形狀未知
 */
const DIRS = { U: [-1, 0], D: [1, 0], L: [0, -1], R: [0, 1] };
const HINT_RULES = {
  single: { U: 0, D: 0, L: 0, R: 0 },
  up:     { U: 0, L: 0, R: 0, D: 1 },
  down:   { D: 0, L: 0, R: 0, U: 1 },
  left:   { L: 0, U: 0, D: 0, R: 1 },
  right:  { R: 0, U: 0, D: 0, L: 1 }
};

/* ================= 求解器（回溯法，計算解的個數） =================
 * limit    : 找到幾個解就停（唯一性檢查用 2）
 * maxNodes : 搜尋節點上限；超過則 aborted=true，表示無法確認
 * 回傳 { count, sols:[...], aborted }，sols 內為 n×n 的 0/1 陣列
 */
function solve(p, limit, maxNodes) {
  const n = p.size, rows = p.rowCounts, cols = p.colCounts, fleet = p.fleet;
  const maxLen = Math.max.apply(null, Object.keys(fleet).map(Number));
  const forced = Array.from({ length: n }, () => Array(n).fill(-1));
  const mids = [];
  let conflict = false;

  function force(r, c, v) {
    if (r < 0 || c < 0 || r >= n || c >= n) return;
    if (forced[r][c] !== -1 && forced[r][c] !== v) conflict = true;
    forced[r][c] = v;
  }
  p.givens.forEach(g => {
    if (g.type === 'water') { force(g.r, g.c, 0); return; }
    force(g.r, g.c, 1);
    const rule = HINT_RULES[g.type];
    if (rule) Object.keys(rule).forEach(k => force(g.r + DIRS[k][0], g.c + DIRS[k][1], rule[k]));
    if (g.type === 'mid') mids.push([g.r, g.c]);
  });
  if (conflict) return { count: 0, sols: [], aborted: false };

  const g = Array.from({ length: n }, () => Array(n).fill(-1));
  const rowRem = rows.slice(), colRem = cols.slice();
  let count = 0, nodes = 0, aborted = false;
  const sols = [];

  function ok(r, c) {
    if (r > 0 && c > 0 && g[r - 1][c - 1] === 1) return false;
    if (r > 0 && c < n - 1 && g[r - 1][c + 1] === 1) return false;
    let h = 1; for (let x = c - 1; x >= 0 && g[r][x] === 1; x--) h++;
    if (h > maxLen) return false;
    let v = 1; for (let y = r - 1; y >= 0 && g[y][c] === 1; y--) v++;
    if (v > maxLen) return false;
    return true;
  }

  function isShip(y, x) { return y >= 0 && x >= 0 && y < n && x < n && g[y][x] === 1; }

  function leaf() {
    for (const m of mids) {
      const y = m[0], x = m[1];
      if (!((isShip(y - 1, x) && isShip(y + 1, x)) || (isShip(y, x - 1) && isShip(y, x + 1)))) return;
    }
    const lens = {};
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++) {
        if (g[r][c] !== 1 || isShip(r - 1, c) || isShip(r, c - 1)) continue;
        let L = 1;
        if (isShip(r, c + 1)) { while (isShip(r, c + L)) L++; }
        else if (isShip(r + 1, c)) { while (isShip(r + L, c)) L++; }
        lens[L] = (lens[L] || 0) + 1;
      }
    const all = new Set(Object.keys(fleet).concat(Object.keys(lens)));
    for (const l of all) if ((lens[l] || 0) !== (fleet[l] || 0)) return;
    count++;
    if (sols.length < 2) sols.push(g.map(row => row.slice()));
  }

  function dfs(idx) {
    if (aborted) return;
    if (++nodes > maxNodes) { aborted = true; return; }
    if (idx === n * n) { leaf(); return; }
    const r = Math.floor(idx / n), c = idx % n;
    for (let v = 1; v >= 0; v--) {
      if (forced[r][c] !== -1 && forced[r][c] !== v) continue;
      if (v === 1) {
        if (rowRem[r] === 0 || colRem[c] === 0) continue;
        g[r][c] = 1;
        if (!ok(r, c)) { g[r][c] = -1; continue; }
        rowRem[r]--; colRem[c]--;
      } else {
        g[r][c] = 0;
      }
      if (rowRem[r] <= n - 1 - c && colRem[c] <= n - 1 - r) dfs(idx + 1);
      if (v === 1) { rowRem[r]++; colRem[c]++; }
      g[r][c] = -1;
      if (count >= limit || aborted) return;
    }
  }
  dfs(0);
  return { count, sols, aborted };
}

/* =====================================================================
 * 人類推理解題器
 * ---------------------------------------------------------------------
 * 只用「人會用的推理」解題，不做回溯猜測。依需要的技巧分三級：
 *
 *  第 1 級（簡單）
 *    行列數字 ：數字已滿 → 其餘是水；剩下空格數 = 還缺的船格數 → 全是船
 *    船周圍是水：船的四個斜角是水；橫著連的船，上下是水（直的同理）；
 *               提示格（圓形／半圓／方塊）直接推出周圍
 *  第 2 級（中等）
 *    船長限制 ：連成的船不能比最長的船長，也不能超出船隊剩餘的長度（已找滿的長度不能再多）
 *    行列排列 ：把一列／一欄所有合理的放法列出來，每種放法都一樣的格子就能確定
 *  第 3 級（困難）
 *    假設推理 ：假設某格是船（或水），用上面的技巧推下去若出現矛盾，該格就是相反的答案
 *  0 級：以上都解不完 → 需要硬猜（回溯），標為「專家」
 * ===================================================================== */

function mkCtx(p) {
  const lens = Object.keys(p.fleet).map(Number);
  return {
    n: p.size, R: p.rowCounts, C: p.colCounts, fleet: p.fleet,
    maxLen: Math.max.apply(null, lens),
    mids: p.givens.filter(g => g.type === 'mid')
  };
}

function atg(g, n, r, c) {                 // 超出棋盤視為水
  return (r < 0 || c < 0 || r >= n || c >= n) ? 0 : g[r][c];
}

function putg(g, n, r, c, v, st) {         // 寫入一格；矛盾時標記 st.bad
  if (r < 0 || c < 0 || r >= n || c >= n) { if (v === 1) st.bad = true; return; }
  if (g[r][c] === -1) {
    g[r][c] = v; st.changed = true;
    if (st.rec) st.rec[st.cur] = true;
  } else if (g[r][c] !== v) {
    st.bad = true;
  }
}

function runLen(g, n, r, c, dr, dc) {      // 從 (r,c) 往某方向連續有幾格船（不含 (r,c)）
  let k = 0, y = r + dr, x = c + dc;
  while (atg(g, n, y, x) === 1) { k++; y += dr; x += dc; }
  return k;
}

/* 找出所有已成形的船：是否直線、是否已封閉、各長度已完成幾艘、還可能的最長船長 */
function analyzeShips(g, x) {
  const n = x.n;
  const seen = Array.from({ length: n }, () => Array(n).fill(false));
  const completed = {};
  const comps = [];
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (g[r][c] !== 1 || seen[r][c]) continue;
      const comp = [], stack = [[r, c]];
      seen[r][c] = true;
      while (stack.length) {
        const [y, z] = stack.pop();
        comp.push([y, z]);
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([a, b]) => {
          const ny = y + a, nz = z + b;
          if (ny >= 0 && nz >= 0 && ny < n && nz < n && g[ny][nz] === 1 && !seen[ny][nz]) {
            seen[ny][nz] = true; stack.push([ny, nz]);
          }
        });
      }
      const sameR = comp.every(q => q[0] === comp[0][0]);
      const sameC = comp.every(q => q[1] === comp[0][1]);
      if (!sameR && !sameC) return { bad: true };
      let done;
      if (comp.length === 1) {
        done = [[1, 0], [-1, 0], [0, 1], [0, -1]].every(([a, b]) => atg(g, n, r + a, c + b) === 0);
      } else if (sameR) {
        const cs = comp.map(q => q[1]);
        done = atg(g, n, r, Math.min.apply(null, cs) - 1) === 0 && atg(g, n, r, Math.max.apply(null, cs) + 1) === 0;
      } else {
        const rs = comp.map(q => q[0]);
        done = atg(g, n, Math.min.apply(null, rs) - 1, c) === 0 && atg(g, n, Math.max.apply(null, rs) + 1, c) === 0;
      }
      if (done) completed[comp.length] = (completed[comp.length] || 0) + 1;
      comps.push({ len: comp.length, done });
    }
  }
  for (const L in completed) if (completed[L] > (x.fleet[L] || 0)) return { bad: true };
  let cap = 0;
  for (let L = 1; L <= x.maxLen; L++) if ((x.fleet[L] || 0) > (completed[L] || 0)) cap = L;
  for (const cp of comps) if (!cp.done && cp.len > cap) return { bad: true };
  return { bad: false, completed, cap };
}

/* 第 1 級：行列數字 */
function ruleCounts(g, x, st) {
  const n = x.n;
  st.cur = '行列數字';
  for (let dir = 0; dir < 2; dir++) {
    for (let i = 0; i < n; i++) {
      const target = dir === 0 ? x.R[i] : x.C[i];
      let s = 0, u = 0;
      for (let k = 0; k < n; k++) {
        const v = dir === 0 ? g[i][k] : g[k][i];
        if (v === 1) s++; else if (v === -1) u++;
      }
      if (s > target || s + u < target) { st.bad = true; return; }
      if (u === 0) continue;
      let fill = -1;
      if (s === target) fill = 0;
      else if (s + u === target) fill = 1;
      if (fill === -1) continue;
      for (let k = 0; k < n; k++) {
        const r = dir === 0 ? i : k, c = dir === 0 ? k : i;
        if (g[r][c] === -1) putg(g, n, r, c, fill, st);
      }
    }
  }
}

/* 第 1 級：船周圍是水（含提示格的方塊推理） */
function ruleShape(g, x, st) {
  const n = x.n;
  st.cur = '船周圍是水';
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (g[r][c] !== 1) continue;
      putg(g, n, r - 1, c - 1, 0, st); putg(g, n, r - 1, c + 1, 0, st);
      putg(g, n, r + 1, c - 1, 0, st); putg(g, n, r + 1, c + 1, 0, st);
      const L = atg(g, n, r, c - 1) === 1, R = atg(g, n, r, c + 1) === 1;
      const U = atg(g, n, r - 1, c) === 1, D = atg(g, n, r + 1, c) === 1;
      if (L || R) { putg(g, n, r - 1, c, 0, st); putg(g, n, r + 1, c, 0, st); }
      if (U || D) { putg(g, n, r, c - 1, 0, st); putg(g, n, r, c + 1, 0, st); }
      if (st.bad) return;
    }
  }
  for (const m of x.mids) {                 // 方塊：船身，同一軸兩側一定是船
    const r = m.r, c = m.c;
    const blockV = atg(g, n, r - 1, c) === 0 || atg(g, n, r + 1, c) === 0;
    const blockH = atg(g, n, r, c - 1) === 0 || atg(g, n, r, c + 1) === 0;
    if (blockV && blockH) { st.bad = true; return; }
    if (blockV) { putg(g, n, r, c - 1, 1, st); putg(g, n, r, c + 1, 1, st); }
    else if (blockH) { putg(g, n, r - 1, c, 1, st); putg(g, n, r + 1, c, 1, st); }
    if (st.bad) return;
  }
}

/* 第 2 級：船長限制（最長船、船隊用完） */
function ruleLimit(g, x, st) {
  const n = x.n;
  const a = analyzeShips(g, x);
  if (a.bad) { st.bad = true; return; }
  st.cur = '船長限制';
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (g[r][c] !== -1) continue;
      const hl = runLen(g, n, r, c, 0, -1), hr = runLen(g, n, r, c, 0, 1);
      const vu = runLen(g, n, r, c, -1, 0), vd = runLen(g, n, r, c, 1, 0);
      const H = hl + hr, V = vu + vd;
      let water = false;
      if (H > 0 && V > 0) water = true;                       // 會彎成 L 形
      else {
        const merged = 1 + Math.max(H, V);
        if (merged > a.cap) water = true;                      // 比任何剩下的船都長
        else {
          let closed;                                          // 放下去後這艘船是否已封閉
          if (H > 0) closed = atg(g, n, r, c - hl - 1) === 0 && atg(g, n, r, c + hr + 1) === 0;
          else if (V > 0) closed = atg(g, n, r - vu - 1, c) === 0 && atg(g, n, r + vd + 1, c) === 0;
          else closed = atg(g, n, r - 1, c) === 0 && atg(g, n, r + 1, c) === 0 &&
                        atg(g, n, r, c - 1) === 0 && atg(g, n, r, c + 1) === 0;
          if (closed && (a.completed[merged] || 0) >= (x.fleet[merged] || 0)) water = true;  // 這個長度的船已找滿
        }
      }
      if (water) putg(g, n, r, c, 0, st);
    }
  }
}

/* 第 2 級：行列排列（列出一列／一欄所有合理放法，找出每種放法都相同的格子） */
function ruleLines(g, x, st) {
  const n = x.n;
  const a = analyzeShips(g, x);
  if (a.bad) { st.bad = true; return; }
  const cap = a.cap;
  st.cur = '行列排列';
  for (let dir = 0; dir < 2; dir++) {
    for (let i = 0; i < n; i++) {
      const target = dir === 0 ? x.R[i] : x.C[i];
      const val = [], unk = [], perp = [], diag = [];
      let ships = 0;
      for (let k = 0; k < n; k++) {
        const r = dir === 0 ? i : k, c = dir === 0 ? k : i;
        const v = g[r][c];
        val.push(v);
        if (v === 1) ships++; else if (v === -1) unk.push(k);
        perp.push(dir === 0
          ? (atg(g, n, r - 1, c) === 1 || atg(g, n, r + 1, c) === 1)
          : (atg(g, n, r, c - 1) === 1 || atg(g, n, r, c + 1) === 1));
        diag.push(atg(g, n, r - 1, c - 1) === 1 || atg(g, n, r - 1, c + 1) === 1 ||
                  atg(g, n, r + 1, c - 1) === 1 || atg(g, n, r + 1, c + 1) === 1);
      }
      const need = target - ships;
      if (need < 0 || need > unk.length) { st.bad = true; return; }
      if (!unk.length) continue;

      const alwaysShip = unk.map(() => true), alwaysWater = unk.map(() => true);
      let valid = 0;
      const tmp = val.slice();
      const check = () => {
        const cnt = {};
        let k = 0;
        while (k < n) {
          if (tmp[k] !== 1) { k++; continue; }
          let e = k; while (e + 1 < n && tmp[e + 1] === 1) e++;
          const len = e - k + 1;
          let fresh = false;                       // 這段船是否包含「這次才假設放下」的格子
          for (let q = k; q <= e; q++) {
            if (diag[q]) return false;
            if (len >= 2 && perp[q]) return false;
            if (val[q] === -1) fresh = true;
          }
          if (fresh) {
            if (len === 1) {
              if (cap < 1) return false;           // 已經沒有任何船可放
            } else {                               // 長度 ≥2 的橫（直）船一定剛好就是這個長度
              cnt[len] = (cnt[len] || 0) + 1;
              if ((a.completed[len] || 0) + cnt[len] > (x.fleet[len] || 0)) return false;
            }
          }
          k = e + 1;
        }
        return true;
      };
      const rec = (idx, left) => {
        if (idx === unk.length) {
          if (left === 0 && check()) {
            valid++;
            for (let j = 0; j < unk.length; j++) {
              if (tmp[unk[j]] === 1) alwaysWater[j] = false; else alwaysShip[j] = false;
            }
          }
          return;
        }
        if (left > unk.length - idx) return;
        if (left > 0) { tmp[unk[idx]] = 1; rec(idx + 1, left - 1); }
        tmp[unk[idx]] = 0; rec(idx + 1, left);
      };
      rec(0, need);
      if (valid === 0) { st.bad = true; return; }
      for (let j = 0; j < unk.length; j++) {
        const r = dir === 0 ? i : unk[j], c = dir === 0 ? unk[j] : i;
        if (alwaysShip[j]) putg(g, n, r, c, 1, st);
        else if (alwaysWater[j]) putg(g, n, r, c, 0, st);
      }
      if (st.bad) return;
    }
  }
}

/* 第 3 級：假設推理（試放一格，用第 1、2 級技巧推到矛盾就排除） */
function ruleTrial(g, x, st) {
  const n = x.n;
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (g[r][c] !== -1) continue;
      for (const v of [1, 0]) {
        const h = g.map(row => row.slice());
        h[r][c] = v;
        const s2 = { bad: false, changed: false, cur: '', rec: null };
        if (!propagate(h, x, 2, s2)) {
          st.cur = '假設推理';
          putg(g, n, r, c, 1 - v, st);
          if (st.bad) return;
          break;
        }
      }
    }
  }
}

function finalCheck(g, x) {
  const n = x.n;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (g[r][c] === -1) return true;
  const a = analyzeShips(g, x);
  if (a.bad) return false;
  for (const L in x.fleet) if ((a.completed[L] || 0) !== x.fleet[L]) return false;
  return true;
}

/* 在 maxTier 允許的技巧內推到不能再推；回傳 false 表示推出矛盾 */
function propagate(g, x, maxTier, st) {
  for (;;) {
    st.changed = false;
    ruleCounts(g, x, st); if (st.bad) return false;
    ruleShape(g, x, st);  if (st.bad) return false;
    if (st.changed) continue;
    if (maxTier >= 2) {
      ruleLimit(g, x, st); if (st.bad) return false;
      if (st.changed) continue;
      ruleLines(g, x, st); if (st.bad) return false;
      if (st.changed) continue;
    }
    if (maxTier >= 3) {
      ruleTrial(g, x, st); if (st.bad) return false;
      if (st.changed) continue;
    }
    break;
  }
  return finalCheck(g, x);
}

/* 用不超過 tier 級的技巧解題。回傳 { solved, grid(-1未知/0水/1船), uses:[用到的技巧名稱] } */
function humanSolve(p, tier) {
  const x = mkCtx(p), n = x.n;
  const g = Array.from({ length: n }, () => Array(n).fill(-1));
  const st = { bad: false, changed: false, cur: '提示', rec: null };
  p.givens.forEach(gv => {
    if (gv.type === 'water') { putg(g, n, gv.r, gv.c, 0, st); return; }
    putg(g, n, gv.r, gv.c, 1, st);
    const rule = HINT_RULES[gv.type];
    if (rule) Object.keys(rule).forEach(k => putg(g, n, gv.r + DIRS[k][0], gv.c + DIRS[k][1], rule[k], st));
  });
  if (st.bad) return { solved: false, grid: g, uses: [] };
  st.rec = {};
  const ok = propagate(g, x, tier, st);
  let unknown = 0;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (g[r][c] === -1) unknown++;
  return { solved: ok && unknown === 0, grid: g, uses: Object.keys(st.rec) };
}

/* 評級：由低到高試，第一個能解完的技巧等級就是題目難度；都解不完 → 0（需猜測） */
function rate(p) {
  for (let t = 1; t <= 3; t++) {
    const r = humanSolve(p, t);
    if (r.solved) return { tier: t, uses: r.uses, grid: r.grid };
  }
  return { tier: 0, uses: [], grid: null };
}

/* ================= 出題 ================= */
function hintTypeAt(layout, n, r, c) {
  const s = (y, x) => y >= 0 && x >= 0 && y < n && x < n && layout[y][x] === 1;
  const U = s(r - 1, c), D = s(r + 1, c), L = s(r, c - 1), R = s(r, c + 1);
  const cnt = U + D + L + R;
  if (cnt === 0) return 'single';
  if (cnt === 1) return U ? 'down' : D ? 'up' : L ? 'right' : 'left';
  return 'mid';
}

function makeHint(layout, n, r, c) {
  return layout[r][c] === 1 ? { r, c, type: hintTypeAt(layout, n, r, c) }
                            : { r, c, type: 'water' };
}

/* 先找出「剛好唯一解」所需的最少提示（用真正答案當提示） */
function minimalHints(n, layout, rowCounts, colCounts, fleet, rng, NODES, deadline) {
  const mk = givens => ({ size: n, rowCounts, colCounts, fleet, givens });
  let givens = [];
  const used = new Set();
  let res = solve(mk(givens), 2, NODES);
  let guard = 0;
  while (!(res.count === 1 && !res.aborted)) {
    if (++guard > n * n || Date.now() > deadline) return null;
    let pick = null;
    if (res.sols.length === 2) {
      const a = res.sols[0], b = res.sols[1];
      const shipC = [], waterC = [];
      for (let r = 0; r < n; r++)
        for (let c = 0; c < n; c++)
          if (a[r][c] !== b[r][c] && !used.has(r * n + c))
            (layout[r][c] === 1 ? shipC : waterC).push([r, c]);
      const pool = shipC.length ? shipC : waterC;
      if (pool.length) pick = pool[Math.floor(rng() * pool.length)];
    }
    if (!pick) {
      const cand = [];
      for (let r = 0; r < n; r++)
        for (let c = 0; c < n; c++)
          if (!used.has(r * n + c)) cand.push([r, c]);
      if (!cand.length) return null;
      pick = cand[Math.floor(rng() * cand.length)];
    }
    used.add(pick[0] * n + pick[1]);
    givens.push(makeHint(layout, n, pick[0], pick[1]));
    res = solve(mk(givens), 2, NODES);
  }
  shuffle(givens, rng);
  for (let i = givens.length - 1; i >= 0; i--) {
    const trial = givens.slice(0, i).concat(givens.slice(i + 1));
    const rr = solve(mk(trial), 2, NODES);
    if (rr.count === 1 && !rr.aborted) givens = trial;
  }
  return givens;
}

/* 依難度出題。
 *   n      : 棋盤邊長
 *   seed   : 題號（同題號＋同設定 → 同一題）
 *   level  : 'easy' | 'medium' | 'hard' | 'expert'
 *   opts   : { hints: 自訂預填格數（省略＝依難度）, maxMs, maxTries }
 * 流程：隨機擺船 → 找最少提示 → 補提示到目標數量（只補「對推理有幫助」且不會讓題目變太簡單的格子）
 *       → 用人類解題器評級，等級不符就換一題重來。
 * 回傳 { puzzle, layout, seed, level, tier, uses, hints, exact }
 *   exact=false 表示時限內找不到完全符合的，回傳的是最接近的一題（tier 為實際難度）
 */
function generate(n, seed, level, opts) {
  opts = opts || {};
  const fleet = FLEETS[n];
  if (!fleet) return null;
  const L = LEVELS[level] || LEVELS.medium;
  const rng = mulberry32(seed);
  const NODES = 150000;
  const t0 = Date.now();
  const limitMs = opts.maxMs || 15000;
  const maxTries = opts.maxTries || 300;
  const range = hintRange(L, n);
  const custom = (opts.hints === undefined || opts.hints === null || opts.hints === '' || isNaN(+opts.hints))
    ? null : Math.max(0, Math.min(Math.floor(+opts.hints), 3 * n));
  let fallback = null;

  for (let tries = 0; tries < maxTries; tries++) {
    if (Date.now() - t0 > limitMs) break;
    const layout = placeFleet(n, fleet, rng);
    if (!layout) continue;
    const rowCounts = layout.map(row => row.reduce((a, b) => a + b, 0));
    const colCounts = [];
    for (let c = 0; c < n; c++) {
      let s = 0; for (let r = 0; r < n; r++) s += layout[r][c];
      colCounts.push(s);
    }
    const mk = givens => ({ size: n, rowCounts, colCounts, fleet, givens });

    const base = minimalHints(n, layout, rowCounts, colCounts, fleet, rng, NODES, t0 + limitMs);
    if (!base) continue;

    let k;
    if (custom !== null) k = custom;
    else if (L.tier === 0) k = base.length;
    else k = range[0] + Math.floor(rng() * (range[1] - range[0] + 1));
    if (base.length > k) continue;                      // 這個盤面光是唯一解就需要更多提示
    if (L.tier === 0 && custom === null && base.length > Math.max(3, Math.round(0.5 * n))) continue;  // 專家也不要提示太多

    const hints = base.slice();
    const have = new Set(hints.map(h => h.r * n + h.c));
    let failed = false;
    while (hints.length < k) {
      const p = mk(hints);
      let pool = [];
      if (L.tier >= 1) {                                // 優先挑「解題卡住時還不知道的格子」，補了才有幫助
        const hs = humanSolve(p, L.tier);
        if (!hs.solved) {
          for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
            if (hs.grid[r][c] === -1 && !have.has(r * n + c)) pool.push([r, c]);
        }
      }
      if (!pool.length) {
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
          if (!have.has(r * n + c)) pool.push([r, c]);
      }
      shuffle(pool, rng);
      let chosen = null;
      for (let i = 0; i < Math.min(pool.length, 12); i++) {
        const h = makeHint(layout, n, pool[i][0], pool[i][1]);
        if (L.tier >= 2 && humanSolve(mk(hints.concat([h])), L.tier - 1).solved) continue;  // 補了會變太簡單
        chosen = h; break;
      }
      if (!chosen) { failed = true; break; }
      hints.push(chosen);
      have.add(chosen.r * n + chosen.c);
    }
    if (failed) continue;

    hints.sort((a, b) => a.r - b.r || a.c - b.c);
    const puzzle = mk(hints);
    const rt = rate(puzzle);
    const exact = rt.tier === L.tier;
    const result = { puzzle, layout, seed, level, tier: rt.tier, uses: rt.uses, hints: hints.length, exact };
    if (exact) return result;
    // 備用：優先留「不需要猜測」的題目
    if (!fallback || (fallback.tier === 0 && rt.tier !== 0)) fallback = result;
  }
  return fallback;
}

/* =====================================================================
 * 每日謎題月曆
 * ---------------------------------------------------------------------
 * 難度與尺寸由伺服器（Code.gs）的排程隨機決定；題目本身由「日期＋難度＋尺寸」
 * 唯一決定，所以全世界同一天、同一排程的玩家拿到的是同一題。
 * ===================================================================== */
const DAILY = {
  start: '2026-11-01',                       // 第一天
  weights: [['easy', 30], ['medium', 35], ['hard', 25], ['expert', 10]],   // 隨機抽難度的比重
  sizes: { easy: [6, 7], medium: [7, 8], hard: [8, 9, 10], expert: [8, 9] },  // 各難度可能的棋盤大小
  stars: { easy: 1, medium: 1, hard: 2, expert: 3 },   // 「當天」完成可得的星星
  unlockCost: 3                              // 解鎖一題過期謎題需要的星星（會扣除）
};

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}

function dateSeed(dateStr) { return (hashStr('battleship-' + dateStr) % 900000) + 1000; }

/* 沒有伺服器時（例如離線預覽）的備用排程：由日期決定，不需要儲存 */
function pseudoPick(dateStr) {
  const rng = mulberry32(hashStr('schedule-' + dateStr));
  let r = rng() * 100, acc = 0, level = 'easy';
  for (const w of DAILY.weights) { acc += w[1]; if (r < acc) { level = w[0]; break; } }
  const sz = DAILY.sizes[level];
  return { level, size: sz[Math.floor(rng() * sz.length)] };
}

/* 產生某天的題目。為了「每台裝置結果一致」，這裡不看時間、只看嘗試次數；
 * 若第一組種子剛好無法完全符合難度，就用固定的下一組種子，直到符合為止。 */
function generateDaily(dateStr, level, size) {
  const base = dateSeed(dateStr);
  let last = null;
  for (let k = 0; k < 40; k++) {
    const out = generate(size, base + k * 7919, level, { maxMs: 1e12, maxTries: 300 });
    if (out && out.exact) return out;
    if (out && !last) last = out;
  }
  return last;
}

/* =====================================================================
 * 測驗：計分（伺服器與瀏覽器共用）
 * ---------------------------------------------------------------------
 * ans    : 學生的盤面，長度 n*n 的字串，每格 '0' 空白／'1' 水／'2' 船（列優先）
 * sol    : 標準答案，n 個長度 n 的字串，'1' 是船、'0' 是水
 * 只計「題目沒有給提示的格子」。完成度取下面兩種算法中較高者：
 *   (1) 只看船：船填對 +1、船填在不是船的格子 −1；水的標記不計（空白視同水）。
 *       分母 = 需要填的船格數。船全對就是 100%，與一般玩法的過關判定一致。
 *   (2) 船水加權：船同上；水格權重 WATER_W（填對 +W、填錯 −W）。
 *       分母 = 船格數 + W × 水格數。讓「零行零列填水」「船四周填水」這些推理也能得分。
 * 最後 完成度 = max(0, 分子) ÷ 分母，上限 100%；本題得分 = 完成度 × 配分。
 * ===================================================================== */
const WATER_W = 0.5;

function solutionRows(p) {
  const r = solve(p, 1, 3000000);
  if (!r.sols.length) return null;
  return r.sols[0].map(row => row.join(''));
}

function gradeBoard(p, sol, ans, points) {
  const n = p.size, given = new Set(p.givens.map(g => g.r * n + g.c));
  let ns = 0, nw = 0, correct = 0, wrong = 0, filled = 0, sShip = 0, sAll = 0;
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (given.has(r * n + c)) continue;
      const ship = sol[r].charAt(c) === '1';
      if (ship) ns++; else nw++;
      const a = (ans && ans.charAt(r * n + c)) || '0';
      if (a === '0') continue;
      filled++;
      const ok = (a === '2') === ship;
      if (ok) correct++; else wrong++;
      if (a === '2') { sShip += ok ? 1 : -1; sAll += ok ? 1 : -1; }
      else sAll += ok ? WATER_W : -WATER_W;
    }
  }
  const pShip = ns ? Math.max(0, sShip) / ns : 1;
  const den = ns + WATER_W * nw, pAll = den ? Math.max(0, sAll) / den : 1;
  const pct = Math.min(1, Math.max(pShip, pAll));
  const pts = Math.round(pct * (points || 0) * 10) / 10;
  return { total: ns + nw, ships: ns, correct, wrong, filled, pct, pts, points: points || 0 };
}



/* ============ 附件第 1 題 ============
 * givens 的 type：
 *   water 水　single 單格船(圓)　up/down/left/right 船頭(半圓)　mid 船身(方塊)　ship 確定是船
 */
const PRESET = {
  size: 6,
  rowCounts: [2, 1, 3, 1, 2, 1],
  colCounts: [3, 0, 3, 1, 0, 3],
  fleet: { 3: 1, 2: 2, 1: 3 },
  givens: [
    { r: 0, c: 0, type: 'water' },
    { r: 2, c: 5, type: 'mid' }
  ]
};

const $ = id => document.getElementById(id);

/* ============ 畫格子（主棋盤與教學小圖共用） ============ */
function shipDiv(U, D, L, R, t) {
  // U/D/L/R：實際相鄰是否有船（用來把相連的船接在一起）
  // t     ：提示格的形狀（single / up / down / left / right / mid），用來決定圓角
  let vU = U, vD = D, vL = L, vR = R, square = false;
  if (t === 'single') { vU = vD = vL = vR = false; }
  else if (t === 'up') { vD = true; vU = false; }
  else if (t === 'down') { vU = true; vD = false; }
  else if (t === 'left') { vR = true; vL = false; }
  else if (t === 'right') { vL = true; vR = false; }
  else if (t === 'mid') { square = true; }
  const s = document.createElement('div');
  s.className = 'ship';
  s.style.top = '1px';
  s.style.bottom = '1px';
  s.style.left = '1px';
  s.style.right = '1px';

/* ============ 棋盤狀態 ============ */
// state: 0 空白, 1 水, 2 船
let puzzle, state, locked, gt;
let mode = 'cal';              // 'cal' 月曆　'daily' 每日謎題　'practice' 自由練習　'exam' 測驗
let lastSolved = false;
let wrong = new Set();         // 「檢查答案」找出的錯格
let cheated = false;           // 練習模式：是否按過「看答案」
let frozen = false;            // 每日謎題：完成後鎖定棋盤
let solvedHandled = false;     // 每日謎題：完成事件只處理一次
let dailyDate = null, dailyData = null;

function setPuzzle(p) {
  puzzle = p;
  cheated = false; frozen = false; solvedHandled = false; wrong = new Set();
  const n = p.size;
  state = Array.from({ length: n }, () => Array(n).fill(0));
  locked = Array.from({ length: n }, () => Array(n).fill(false));
  gt = Array.from({ length: n }, () => Array(n).fill(null));
  p.givens.forEach(g => {
    state[g.r][g.c] = g.type === 'water' ? 1 : 2;
    locked[g.r][g.c] = true;
    gt[g.r][g.c] = g.type;
  });
  render();
}

function ship(r, c) {
  const n = puzzle.size;
  return r >= 0 && c >= 0 && r < n && c < n && state[r][c] === 2;
}

/* ============ 規則檢查（玩家填的盤面） ============ */
function analyze() {
  const n = puzzle.size;
  const rc = Array(n).fill(0), cc = Array(n).fill(0);
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      if (state[r][c] === 2) { rc[r]++; cc[c]++; }

  const bad = new Set();
  const key = (r, c) => r * n + c;

  // 1) 對角相鄰（直線的船不可能出現對角相鄰的兩格）
  for (let r = 0; r < n - 1; r++) {
    for (let c = 0; c < n; c++) {
      if (!ship(r, c)) continue;
      if (ship(r + 1, c - 1)) { bad.add(key(r, c)); bad.add(key(r + 1, c - 1)); }
      if (ship(r + 1, c + 1)) { bad.add(key(r, c)); bad.add(key(r + 1, c + 1)); }
    }
  }

  // 2) 連通區域 → 每艘船：必須是直線，統計長度
  const fleet = puzzle.fleet;
  const maxLen = Math.max.apply(null, Object.keys(fleet).map(Number));
  const seen = new Set();
  const lens = {};
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (!ship(r, c) || seen.has(key(r, c))) continue;
      const comp = [], stack = [[r, c]];
      seen.add(key(r, c));
      while (stack.length) {
        const [y, x] = stack.pop();
        comp.push([y, x]);
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dy, dx]) => {
          const ny = y + dy, nx = x + dx;
          if (ship(ny, nx) && !seen.has(key(ny, nx))) { seen.add(key(ny, nx)); stack.push([ny, nx]); }
        });
      }
      const sameRow = comp.every(p => p[0] === comp[0][0]);
      const sameCol = comp.every(p => p[1] === comp[0][1]);
      if (!sameRow && !sameCol) {
        comp.forEach(p => bad.add(key(p[0], p[1])));   // L 形、T 形等
      } else if (comp.length > maxLen) {
        comp.forEach(p => bad.add(key(p[0], p[1])));   // 比最大的船還長
      } else {
        lens[comp.length] = (lens[comp.length] || 0) + 1;
      }
    }
  }

  // 3) 行列數字、船隊數量
  const countsOk = rc.every((v, i) => v === puzzle.rowCounts[i]) &&
                   cc.every((v, i) => v === puzzle.colCounts[i]);
  const allLens = new Set(Object.keys(fleet).concat(Object.keys(lens)));
  let fleetOk = true;
  allLens.forEach(l => { if ((lens[l] || 0) !== (fleet[l] || 0)) fleetOk = false; });

  return { rc, cc, bad, lens, countsOk, fleetOk,
           solved: countsOk && fleetOk && bad.size === 0 };
}

/* ============ 畫面 ============ */
function boardSize(n) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const byW = Math.floor((vw - 32) / (n + 1));
  let m = Math.min(byW, 64);
  if (vh >= 300 && !$('gameView').hidden) {
    const top = $('grid').getBoundingClientRect().top + window.scrollY;
    const below = $('fleet').offsetHeight + $('msg').offsetHeight + 36;
    m = Math.min(m, Math.floor((vh - top - below) / (n + 1)));
  }
  return Math.max(24, m);
}

function fleetIcons(fl, fleet, lens, cs) {
  fl.style.setProperty('--fs', Math.max(12, Math.min(22, Math.round(cs * 0.42))) + 'px');
  fl.innerHTML = '';
  Object.keys(fleet).map(Number).sort((a, b) => b - a).forEach(L => {
    const total = fleet[L], have = lens[L] || 0;
    const g = document.createElement('div'); g.className = 'fgrp' + (have > total ? ' over' : '');
    const row = document.createElement('div'); row.className = 'row'; g.appendChild(row);
    for (let i = 0; i < total; i++) {
      const ic = document.createElement('div'); ic.className = 'fic' + (i < have ? ' used' : '');
      for (let k = 0; k < L; k++) {
        const x = document.createElement('i');
        x.className = 'fg' + (L === 1 ? ' s' : k === 0 ? ' l' : k === L - 1 ? ' r' : '');
        ic.appendChild(x);
      }
      row.appendChild(ic);
    }

    const nm = document.createElement('div'); nm.className = 'fname'; nm.textContent = FLEET_NAMES[L] || ''; g.appendChild(nm);
    g.title = L + ' 格船（' + (FLEET_NAMES[L] || '') + '）' + Math.min(have, total) + '/' + total;
    fl.appendChild(g);
  });
}

function render() {
  const n = puzzle.size;
  const info = analyze();
  if (mode === 'exam' && !exRules) info.bad = new Set();
  const grid = $('grid');
  const cs = boardSize(n);
  grid.style.setProperty('--cs', cs + 'px');
  $('gameView').style.setProperty('--bw', Math.max(cs * (n + 1), 440) + 'px');
  grid.style.gridTemplateColumns = 'repeat(' + (n + 1) + ', var(--cs))';
  grid.innerHTML = '';

  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const d = document.createElement('div');
      d.className = 'cell';
      if (locked[r][c]) d.classList.add('locked');
      paintCell(d, state[r][c], ship(r - 1, c), ship(r + 1, c), ship(r, c - 1), ship(r, c + 1),
                gt[r][c], info.bad.has(r * n + c));
      if (wrong.has(r * n + c)) d.classList.add('wrong');
      d.addEventListener('click', () => onCell(r, c));
      grid.appendChild(d);
    }
    const lab = document.createElement('div');
    lab.className = 'lab ' + labClass(info.rc[r], puzzle.rowCounts[r]);
    lab.textContent = puzzle.rowCounts[r];
    grid.appendChild(lab);
  }
  for (let c = 0; c < n; c++) {
    const lab = document.createElement('div');
    lab.className = 'lab ' + labClass(info.cc[c], puzzle.colCounts[c]);
    lab.textContent = puzzle.colCounts[c];
    grid.appendChild(lab);
  }

  lastSolved = info.solved;
  fleetIcons($('fleet'), puzzle.fleet, info.lens, cs);

  const msg = $('msg');
  if (mode === 'exam') { msg.textContent = ''; msg.className = ''; }
  else if (info.solved && mode === 'daily') {
    msg.textContent = '✅ 已完成' + (frozen ? '（按「重來」可重玩）' : ''); msg.className = 'win';
    if (!solvedHandled) { solvedHandled = true; onDailySolved(); }
  }
  else if (info.solved && cheated) { msg.textContent = '（已顯示答案）'; msg.className = ''; }
  else if (info.solved) {
    msg.textContent = '🎉 過關！'; msg.className = 'win';
    if (!solvedHandled) {
      solvedHandled = true;
      celebrate({ kind: 'prac', title: '🎉 過關！', sub: puzzle.size + '×' + puzzle.size,
                  buttons: [{ t: '看看棋盤' }, { t: '再來一題', primary: true, fn: () => $('gen').click() }] });
    }
  }
  else if (info.bad.size) { msg.textContent = '紅色的船違反規則'; msg.className = ''; }
  else { msg.textContent = ''; msg.className = ''; }

  if (!render.busy) {                       // 版面（提示文字、題目選單）變動後再量一次，確保整個棋盤塞得進螢幕
    render.busy = true;
    try { if (boardSize(n) !== cs) render(); } finally { render.busy = false; }
  }
}

function labClass(cur, target) {
  if (cur === target) return 'ok';
  if (cur > target) return 'over';
  return '';
}

function onCell(r, c) {
  if (locked[r][c] || frozen) return;
  wrong = new Set();
  state[r][c] = (state[r][c] + 1) % 3;   // 空白 → 水 → 船 → 空白
  if (mode === 'daily') saveBoard();
  if (mode === 'exam') exChanged();
  render();
}

  const custom = ct === '' ? null : Math.max(0, Math.min(parseInt(ct, 10) || 0, 3 * n));
  let seed = parseInt(seedInput.value, 10);
  if (isNaN(seed)) seed = Math.floor(Math.random() * 900000) + 1000;
  msgEl.textContent = '出題中…'; msgEl.className = '';
  setBusy(true);
  setTimeout(() => {
    const out = generate(n, seed, lv, { hints: custom, maxMs: 6000 });
    setBusy(false);
    if (!out) {
      msgEl.textContent = '這組設定找不到「只有唯一解」的題目（預填格太少時很難）。請增加預填格數，或換個難度再試。';
      msgEl.className = 'warn';
      return;
    }
    seedInput.value = seed;
    setPuzzle(out.puzzle);
    describe(n + '×' + n + '　' + LEVELS[lv].name + '　預填 ' + out.hints + ' 格　題號 ' + seed, out);

      msgEl.className = 'warn';

function checkAnswer() {
  if (frozen) return;
  const res = solve(puzzle, 1, 3000000);
  if (!res.sols.length) { msgEl.textContent = '找不到答案'; return; }
  const sol = res.sols[0], n = puzzle.size;
  wrong = new Set();
  let missing = 0;
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++) {
      if (locked[r][c]) continue;
      const isShip = sol[r][c] === 1;
      if (state[r][c] !== 0 && (state[r][c] === 2) !== isShip) wrong.add(r * n + c);
      else if (isShip && state[r][c] !== 2) missing++;
    }
  render();
  const msg = $('msg');
  if (wrong.size) { msg.textContent = '有 ' + wrong.size + ' 格填錯了（紅色標示）'; msg.className = 'warn'; }
  else if (!msg.textContent) { msg.textContent = '目前填的都正確，還有船沒找完，繼續加油！'; msg.className = 'warn'; }
}

  calendar(ok, fail) {
    if (HAS_GAS) { google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getCalendarData(); return; }
    const today = previewToday(), start = '2026-11-01', days = [];
    for (let d = start; d <= today; d = addDays(d, 1)) {
      const e = EMBED[d];
      if (e) days.push({ date: d, level: e.level, size: e.size, hints: e.hints, tier: e.tier });
      else { const m = previewMeta(d); days.push({ date: d, level: m.level, size: m.size }); }
    }
    const p = today.split('-').map(Number);
    setTimeout(() => ok({ now: Date.UTC(p[0], p[1] - 1, p[2], 4, 0, 0), today, start, unlock: { mode: 'today', count: 3 }, days }), 20);
  },
  puzzle(date, ok, fail) {
    if (HAS_GAS) { google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getPuzzle(date); return; }
    setTimeout(() => {
      if (date > previewToday()) { fail(new Error('這一天的謎題還沒有開放')); return; }
      if (EMBED[date]) { ok(EMBED[date]); return; }
      if (!previewCache[date]) {
        const m = previewMeta(date);
        const out = generate(m.size, m.seed, m.level, { maxMs: 8000 });
        const lv = { 1: 'easy', 2: 'medium', 3: 'hard', 0: 'expert' }[out.tier];
        previewCache[date] = { date, level: lv, size: m.size, hints: out.hints, tier: out.tier, puzzle: out.puzzle };
      }
      ok(previewCache[date]);
    }, 350);
  }
};

const PKEY = 'bs_cal_v1';

  catch (e) { storageOk = false; }
  return { v: 1, days: {} };
}
function persist() { try { window.localStorage.setItem(PKEY, JSON.stringify(prog)); } catch (e) { storageOk = false; } }

/* ---- 月曆資料 ---- */
let cal = null;      // { start, unlock, serverNow, t0, days:{date:meta}, month }
function todayNow() { return taipeiDate(cal.serverNow + (Date.now() - cal.t0)); }   // 以伺服器時間為準，不受使用者電腦時間影響

function loadCalendar() {
  $('calErr').hidden = true;
  api.calendar(res => {
    const keepMonth = cal && cal.month;
    cal = { start: res.start, unlock: res.unlock || { mode: 'today', count: 3 }, serverNow: res.now, t0: Date.now(), days: {}, month: keepMonth || null };
    res.days.forEach(d => { cal.days[d.date] = d; });
    const t = todayNow();
    if (!cal.month || cal.month > t.slice(0, 7) || cal.month < cal.start.slice(0, 7)) cal.month = t.slice(0, 7);
    renderCal();
    exCalSync();
  }, err => {
    $('calErr').hidden = false;
    $('calErr').innerHTML = '無法連線到伺服器：' + ((err && err.message) || err) + ' <button id="retry">重試</button>';
    $('retry').addEventListener('click', loadCalendar);
  });
}

/* ---- 補題解鎖規則 ----
 * mode 'today'：完成「今日謎題」後，今天可以補解過期謎題
 * mode 'count'：累計「準時」完成 N 題後，永久解鎖
 * （規則設定在 Code.gs 的 DAILY_CONFIG.UNLOCK） */
function unlockInfo() {
  const U = cal.unlock, today = todayNow();
  if (U.mode === 'count') {
    const n = Object.keys(prog.days).filter(d => prog.days[d].t).length;
    return { mode: 'count', unlocked: n >= U.count, cur: n, need: U.count, text: '累計準時完成 ' + U.count + ' 題' };
  }
  const done = !!(prog.days[today] && prog.days[today].d);
  return { mode: 'today', unlocked: done, cur: done ? 1 : 0, need: 1, text: '完成今日謎題' };
}

function statusOf(date, today, U) {
  if (date < cal.start) return 'before';
  if (date > today) return 'future';
  const r = prog.days[date];
  if (r && r.d) return r.t ? 'ontime' : 'late';
  if (date === today) return 'today';
  return U.unlocked ? 'past' : 'locked';
}

function streak() {
  const today = todayNow();
  let d = today;
  if (!(prog.days[d] && prog.days[d].t)) d = addDays(d, -1);     // 今天還沒解，連續天數保留到午夜
  let n = 0;
  while (d >= cal.start && prog.days[d] && prog.days[d].t) { n++; d = addDays(d, -1); }
  return n;
}

function fitCal() {                       // 讓整個月曆（含圖例）塞進螢幕高度
  const view = $('calView'); if (view.hidden) return;
  const grid = $('calGrid'), rows = Math.max(1, Math.ceil((grid.children.length - 7) / 7));
  view.style.setProperty('--calw', '420px');
  const top = grid.getBoundingClientRect().top + window.scrollY;
  const below = $('legend').offsetHeight + $('calFoot').offsetHeight + 26;
  const gap = 6, wdH = 22;
  const avail = innerHeight - top - below - wdH - gap * rows;
  const cellH = avail / rows;
  const w = Math.floor(Math.min(520, innerWidth - 28, Math.max(7 * 36, cellH * 1.05 * 7 + gap * 6)));
  view.style.setProperty('--calw', w + 'px');
}
window.addEventListener('resize', () => fitCal());

function renderCal() {
  if (!cal) return;
  const today = todayNow(), U = unlockInfo();
  const [y, m] = cal.month.split('-').map(Number);
  $('mTitle').textContent = y + ' 年 ' + m + ' 月';
  $('mPrev').disabled = cal.month <= cal.start.slice(0, 7);
  $('mNext').disabled = cal.month >= today.slice(0, 7);
  const g = $('calGrid');
  g.innerHTML = '';
  WD.forEach(w => { const d = document.createElement('div'); d.className = 'wd'; d.textContent = w; g.appendChild(d); });
  const first = weekday(cal.month + '-01'), dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  for (let i = 0; i < first; i++) g.appendChild(document.createElement('div'));
  for (let d = 1; d <= dim; d++) {
    const date = cal.month + '-' + PAD(d);
    const st = statusOf(date, today, U), rec = prog.days[date];
    const meta = cal.days[date];
    const mark = { today: '⚓', past: '⚓', locked: '🔒', ontime: '★', late: '✓' }[st] || '';
    const showLv = (st === 'ontime' || st === 'late' || (rec && rec.o)) && meta && LVNAME[meta.level];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'day st-' + st;
    b.dataset.date = date;
    if (st === 'before') b.disabled = true;
    b.setAttribute('aria-label', mdLabel(date) + ' ' + ({ today: '今日謎題', past: '可補題', locked: '補題未解鎖', ontime: '已準時完成', late: '已補題完成', future: '尚未開放', before: '' }[st]));
    const xe = exOnDate(date);
    if (xe) b.classList.add('hasexam');
    b.innerHTML = (xe ? '<span class="exm">📝</span>' : '') + (st === 'today' ? '<span class="ribbon">今日</span>' : '') +
      '<span class="num">' + d + '</span><span class="mark">' + mark + '</span>' +
      (showLv ? '<span class="chip">' + LVNAME[meta.level] + '</span>' : '');
    b.addEventListener('click', () => onDayClick(date, b));
    g.appendChild(b);
  }

  const ban = $('calBanner');
  if (U.unlocked) {
    ban.className = 'ban ok';
    ban.innerHTML = '🔓 <b>補題已解鎖</b>' + (U.mode === 'today' ? '：今天可以補解任何過期的謎題' : '：可以隨時補解過期的謎題');
  } else {
    ban.className = 'ban lock';
    ban.innerHTML = '🔒 <b>補題未解鎖</b>：' + U.text + '即可解鎖' + (U.mode === 'today' ? '今天的補題' : '（' + U.cur + '/' + U.need + '）') +
      ' <button id="goToday">去解今日謎題</button>';
    $('goToday').addEventListener('click', goToday);
  }
  const ds = Object.keys(prog.days).filter(d => prog.days[d].d && d >= cal.start && d <= today);
  const ot = ds.filter(d => prog.days[d].t).length;
  $('calStats').textContent = '已完成 ' + ds.length + ' 題（準時 ' + ot + '）　連續準時 ' + streak() + ' 天';
  $('calFoot').innerHTML = '每天（台北時間）一題，<b>難度隨機</b>。' +
    '<br>進度存在這個瀏覽器，換裝置不會同步。' +
    (storageOk ? '' : '<br>⚠ 這個瀏覽器無法儲存進度，關閉頁面後紀錄會消失。');
  exBanner();
  fitCal();
}

function goToday() {
  const t = todayNow();
  cal.month = t.slice(0, 7);
  renderCal();
  const el = document.querySelector('.day[data-date="' + t + '"]');
  hideDlg();
  if (el) onDayClick(t, el);
}

let toastTimer = null;
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
}
function showDlg(title, body, buttons) {
  $('dlgT').textContent = title; $('dlgB').innerHTML = body;
  const box = $('dlgBtns'); box.innerHTML = '';
  buttons.forEach(b => {
    const x = document.createElement('button'); x.textContent = b.text; if (b.primary) x.className = 'primary';
    x.addEventListener('click', b.fn || hideDlg); box.appendChild(x);
  });
  $('dlg').classList.add('show');
}
function hideDlg() { $('dlg').classList.remove('show'); }
function shake(el) {
  if (!el || typeof el.animate !== 'function') return;
  el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px) rotate(-3deg)' }, { transform: 'translateX(6px) rotate(3deg)' },
              { transform: 'translateX(-4px)' }, { transform: 'translateX(0)' }], { duration: 380, easing: 'ease-in-out' });
}

/* ---- 點日期 ---- */
let opening = false;
function onDayClick(date, el) {
  if (opening) return;
  const xe = exOnDate(date);
  if (xe && exCalClick(xe, date, el)) return;
  const st = statusOf(date, todayNow(), unlockInfo());
  if (st === 'before') return;
  if (st === 'future') { shake(el); toast(mdLabel(date) + '的謎題會在當天 00:00 開放'); return; }
  if (st === 'locked') {
    shake(el);
    const U = unlockInfo();
    showDlg('🔒 補題尚未解鎖',
      '過期的謎題要先「達標」才能補解。<br><b>達標條件：' + U.text + '</b>' + (U.mode === 'count' ? '<br>目前 ' + U.cur + ' / ' + U.need : '') +
      '<br>達標後就能回來補解 ' + mdLabel(date) + '的謎題。',
      [{ text: '知道了' }, { text: '去解今日謎題', primary: true, fn: goToday }]);
    return;
  }
  openCover(date, el);
}

/* ---- 揭開封面：格子飛到畫面中央 → 封面像門一樣翻開 → 轉場進入棋盤 ---- */
function revealHtml(date, data, isToday) {
  if (!data) return '<div class="rdate">' + Number(date.slice(8)) + '</div><div class="rwd">' + mdLabel(date) + '</div><div class="rload">翻開中…</div>';
  const t = LVTIER[data.level];
  return '<div class="rdate">' + date.slice(5, 7) + '/' + date.slice(8, 10) + '</div><div class="rwd">週' + WD[weekday(date)] + '</div>' +
    '<div class="rlv"><span class="tag t' + t + '">' + LVNAME[data.level] + '</span></div>' +
    '<div class="rinfo">' + data.size + '×' + data.size + '　預填 ' + data.hints + ' 格</div>' +
    '<div class="rtip">' + (isToday ? '準時挑戰 ★' : '補題挑戰 ✓') + '</div>';
}

async function playOpen(el, date, dp) {
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (!el || typeof el.animate !== 'function' || reduce) return dp;      // 不支援動畫或使用者要求減少動態 → 直接進入
  const isToday = date === todayNow();
  const vw = window.innerWidth, vh = window.innerHeight;
  const W = Math.min(vw * 0.86, 340), H = Math.round(W * 0.92);
  const r = el.getBoundingClientRect();

  const stage = document.createElement('div'); stage.className = 'stage';
  const card = document.createElement('div'); card.className = 'stagecard';
  card.style.width = W + 'px'; card.style.height = H + 'px';
  card.style.left = ((vw - W) / 2) + 'px'; card.style.top = ((vh - H) / 2) + 'px';
  const reveal = document.createElement('div'); reveal.className = 'reveal'; reveal.innerHTML = revealHtml(date, null, isToday);
  const door = document.createElement('div'); door.className = 'door';
  door.innerHTML = '<div class="dnum">' + Number(date.slice(8)) + '</div><div class="danchor">⚓</div><div class="dknob"></div>';
  card.appendChild(reveal); card.appendChild(door); stage.appendChild(card); document.body.appendChild(stage);
  dp.then(d => { reveal.innerHTML = revealHtml(date, d, isToday); }, () => {});

  let skipped = false;
  const anims = [], hooks = [];
  stage.addEventListener('click', () => { skipped = true; anims.forEach(a => { try { a.finish(); } catch (e) { /* 已結束 */ } }); hooks.forEach(h => h()); });
  const dur = ms => (skipped ? 0 : ms);
  const run = (node, kf, opt) => { const a = node.animate(kf, Object.assign({ fill: 'both' }, opt)); anims.push(a); return a.finished.catch(() => {}); };
  const wait = ms => new Promise(res => { if (skipped) { res(); return; } const t = setTimeout(res, ms); hooks.push(() => { clearTimeout(t); res(); }); });

  const dx = r.left + r.width / 2 - vw / 2, dy = r.top + r.height / 2 - vh / 2, sc = r.width / W;
  await Promise.all([
    run(stage, [{ background: 'rgba(8,20,40,0)' }, { background: 'rgba(8,20,40,.62)' }], { duration: dur(380) }),
    run(card, [{ transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sc + ')' }, { transform: 'translate(0,0) scale(1)' }],
        { duration: dur(540), easing: 'cubic-bezier(.2,.85,.25,1)' })
  ]);
  await run(door, [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-112deg)' }], { duration: dur(950), easing: 'cubic-bezier(.55,0,.25,1)' });

  let data;
  try { data = await dp; }
  catch (e) { stage.remove(); throw e; }
  reveal.innerHTML = revealHtml(date, data, isToday);
  await wait(950);
  await Promise.all([
    run(card, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.3)', opacity: 0 }], { duration: dur(380), easing: 'ease-in' }),
    run(stage, [{ opacity: 1 }, { opacity: 0 }], { duration: dur(380) })
  ]);
  stage.remove();
  return data;
}

function openCover(date, el) {
  opening = true;
  const dp = new Promise((res, rej) => api.puzzle(date, res, rej));
  playOpen(el, date, dp).then(data => { opening = false; enterDaily(date, data); },
    err => { opening = false; toast('載入失敗：' + ((err && err.message) || err)); });
}

/* ---- 每日謎題：進入、儲存、完成 ---- */
function ser() { return state.map(r => r.join('')).join('|'); }
function deser(s) {
  const rows = String(s).split('|');
  if (rows.length !== puzzle.size) return;
  rows.forEach((row, r) => { if (row.length === puzzle.size) for (let c = 0; c < puzzle.size; c++) if (!locked[r][c]) state[r][c] = +row[c] || 0; });
}
function saveBoard() {
  const rec = prog.days[dailyDate] || (prog.days[dailyDate] = {});
  if (rec.d) return;                       // 已完成的日子保留完成時的盤面，重玩不覆蓋
  rec.b = ser(); persist();
}

function enterDaily(date, data) {
  mode = 'daily'; dailyDate = date; dailyData = data;
  const rec = prog.days[date] || (prog.days[date] = {});
  rec.o = 1;
  if (!cal.days[date]) cal.days[date] = { date: date, level: data.level, size: data.size, hints: data.hints, tier: data.tier };
  setPuzzle(data.puzzle);
  if (rec.b) deser(rec.b);
  frozen = !!rec.d;
  solvedHandled = !!rec.d;                 // 看已完成的日子時，不再重複慶祝
  persist();
  showView('game');
  const isToday = date === todayNow();
  $('seedinfo').textContent = mdLabel(date) + '　' + data.size + '×' + data.size + '　預填 ' + data.hints + ' 格';
  $('techinfo').innerHTML = '難度 <span class="tag t' + LVTIER[data.level] + '">' + LVNAME[data.level] + '</span>　' + (isToday ? '準時挑戰 ★' : '補題 ✓');
  render();
}

function onDailySolved() {
  const rec = prog.days[dailyDate] || (prog.days[dailyDate] = {});
  const wasUnlocked = unlockInfo().unlocked;
  const onTime = dailyDate === todayNow();
  if (!rec.d) { rec.d = 1; rec.t = onTime ? 1 : 0; rec.at = Date.now(); }
  rec.b = ser();
  persist();
  frozen = true;
  const U = unlockInfo();
  const t = LVTIER[dailyData.level];
  const title = rec.t ? '🌟 準時完成！' : '✔ 補題完成';
  let sub = mdLabel(dailyDate) + '　<span class="tag t' + t + '">' + LVNAME[dailyData.level] + '</span>　' + dailyData.size + '×' + dailyData.size;
  if (rec.t) sub += '<br>連續準時 ' + streak() + ' 天<br><a href="./index.html#done-boat" style="display:inline-block;margin-top:6px;padding:6px 14px;border-radius:14px;background:#2563c9;color:#fff;text-decoration:none;font-weight:700">回錨界入口，點亮海測</a>';
  if (!wasUnlocked && U.unlocked) sub += '<br>🔓 <b>達標！補題已解鎖</b>，可以回月曆補解過期謎題了';
  else if (!U.unlocked && U.mode === 'count') sub += '<br>補題解鎖進度 ' + U.cur + '/' + U.need;
  celebrate({
    kind: rec.t ? 'ontime' : 'late', title: title, sub: sub, confetti: !wasUnlocked && U.unlocked,
    buttons: [{ t: '看看棋盤' }, { t: '返回月曆', primary: true, fn: goCal }],
    fallback: () => { $('winT').textContent = title; $('winS').innerHTML = sub; $('win').classList.add('show'); }
  });
}

function confetti() {
  const colors = ['#f8cb5a', '#2563c9', '#2e9e5b', '#c0392b', '#7c3aed', '#0e7490'];
  for (let i = 0; i < 44; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.left = (Math.random() * 100) + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--x', ((Math.random() - 0.5) * 160) + 'px');
    c.style.setProperty('--r', ((Math.random() - 0.5) * 1080) + 'deg');
    c.style.setProperty('--d', (2 + Math.random() * 1.8) + 's');
    c.style.setProperty('--delay', (Math.random() * 0.5) + 's');
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4800);
  }
}

/* ============ 教學 ============ */
function miniBoard(spec) {
  // spec.rows：字串陣列，'.' 空白 '~' 水 '#' 船；spec.rc / spec.cc：行列數字（可省略）
  // spec.types：{ "r,c": 提示形狀 }（金框，不可點）；spec.hl：[[r,c],…] 綠框＝這格是推得出來的
  // spec.live：true 時可點擊切換（教學操作示範）；spec.plain：船一律畫成方塊（只表示「是船」）
  const rows = spec.rows.map(s => s.split(''));
  const R = rows.length, C = rows[0].length;
  const st = rows.map(r => r.map(ch => ch === '#' ? 2 : ch === '~' ? 1 : 0));
  const types = spec.types || {};
  const hl = new Set((spec.hl || []).map(a => a.join(',')));
  const wrap = document.createElement('div');
  wrap.className = 'mini' + (spec.live ? ' live' : '');
  wrap.style.setProperty('--cs', (spec.cs || 34) + 'px');
  wrap.style.gridTemplateColumns = 'repeat(' + (C + (spec.rc ? 1 : 0)) + ', var(--cs))';
  const S = (r, c) => r >= 0 && c >= 0 && r < R && c < C && st[r][c] === 2;
  function draw() {
    wrap.innerHTML = '';
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        const d = document.createElement('div');
        d.className = 'cell';
        const k = r + ',' + c;
        if (types[k]) d.classList.add('locked');
        if (hl.has(k)) d.classList.add('hl');
        paintCell(d, st[r][c], S(r - 1, c), S(r + 1, c), S(r, c - 1), S(r, c + 1), types[k] || (spec.plain ? 'mid' : null), false);
        if (spec.live && !types[k]) d.addEventListener('click', () => { st[r][c] = (st[r][c] + 1) % 3; draw(); });
        wrap.appendChild(d);
      }
      if (spec.rc) { const l = document.createElement('div'); l.className = 'lab'; l.textContent = spec.rc[r]; wrap.appendChild(l); }
    }
    if (spec.cc) {
      for (let c = 0; c < C; c++) { const l = document.createElement('div'); l.className = 'lab'; l.textContent = spec.cc[c]; wrap.appendChild(l); }
    }
  }
  draw();
  return wrap;
}

}
function renderTut() {
  const card = $('tutcard'), key = innerWidth + 'x' + innerHeight;
  if (key !== tutHW || !tutH) {            // 量出「最高的那一頁」，之後每一頁都用同樣大小的卡片
    const cur = tutPage;
    card.style.height = ''; card.style.minHeight = '0';
    let hmax = 0;
    for (let i = 0; i < TUT.length; i++) {
      tutPage = i; card.style.height = 'auto';
      fitPageAuto();
      hmax = Math.max(hmax, card.offsetHeight);
    }
    tutPage = cur; tutH = Math.min(hmax, innerHeight - 24); tutHW = key;
    card.style.minHeight = '';
  }
  card.style.height = tutH + 'px';
  fitPage();
  card.scrollTop = 0;
}
function fitPageAuto() {                    // 量測用：卡片高度不限，只用視窗高度當上限來縮圖
  const card = $('tutcard'), limit = innerHeight - 24;
  tutScale = 1; buildTut();
  for (let i = 0; i < 14 && card.offsetHeight > limit && tutScale > 0.45; i++) { tutScale -= 0.06; buildTut(); }
}
window.addEventListener('resize', () => { if (tutEl.classList.contains('show')) renderTut(); });

function buildTut() {
  const pg = TUT[tutPage];
  $('tuttitle').textContent = (tutPage + 1) + ' / ' + TUT.length + '　' + pg.title;
  const body = $('tutbody');
  body.innerHTML = pg.text;
  if (pg.minis.length) {
    const row = document.createElement('div');
    row.className = 'minirow';
    pg.minis.forEach(m => {
      const box = document.createElement('div');
      box.className = 'minibox';
      const sp = Object.assign({}, m.spec); sp.cs = Math.max(16, Math.round((sp.cs || 34) * tutScale)); box.appendChild(miniBoard(sp));
      if (m.cap) { const cp = document.createElement('div'); cp.className = 'cap'; cp.innerHTML = m.cap; box.appendChild(cp); }
      row.appendChild(box);
    });
    body.appendChild(row);
  }
  if (pg.fleetDemo) {
    const demo = document.createElement('div'); demo.className = 'minirow';
    [[{}, '還沒放：圖示全黑'], [{ 3: 1, 1: 1 }, '放好一艘 3 格船和一艘 1 格船：對應圖示變暗']].forEach(([lens, cap]) => {
      const box = document.createElement('div'); box.className = 'minibox';
      const fl = document.createElement('div'); fl.className = 'tutfleet';
      fleetIcons(fl, { 3: 1, 2: 1, 1: 2 }, lens, 40 * tutScale);
      box.appendChild(fl);
      const cp = document.createElement('div'); cp.className = 'cap'; cp.textContent = cap; box.appendChild(cp);
      demo.appendChild(box);
    });
    body.appendChild(demo);
  }
  const dots = $('dots');
  dots.innerHTML = '';
  TUT.forEach((_, i) => { const s = document.createElement('span'); if (i === tutPage) s.className = 'on'; dots.appendChild(s); });
  $('tutprev').style.visibility = tutPage === 0 ? 'hidden' : 'visible';
  const last = tutPage === TUT.length - 1;
  $('tutnext').textContent = last ? '開始遊戲' : '下一步';
  $('tutskip').style.visibility = last ? 'hidden' : 'visible';
}

function openTut() { tutPage = 0; tutEl.classList.add('show'); renderTut(); }
function closeTut() {
  tutEl.classList.remove('show');
  if ($('tutcheck').checked) lsSet('bs_tut_seen', '1');
}

$('tutnext').addEventListener('click', () => {
  if (tutPage >= TUT.length - 1) closeTut(); else { tutPage++; renderTut(); }
});
$('tutprev').addEventListener('click', () => { if (tutPage > 0) { tutPage--; renderTut(); } });
$('tutskip').addEventListener('click', closeTut);
$('help').addEventListener('click', openTut);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (tutEl.classList.contains('show')) closeTut();
  else if ($('dlg').classList.contains('show')) hideDlg();
});
